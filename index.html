<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ルミナリア</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a1d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* ===== ルミナリア 全体トークン ===== */
:root {
  color-scheme: dark;
  --night: #060a1d;
  --deep: #0d1540;
  --indigo: #1a2566;
  --ink: #eef1ff;
  --mute: #9ba6d6;
  --line: rgba(170, 190, 255, .18);
  --gold: #ffd46a;
  --gold-d: #b9861c;
  --cyan: #7ef3ff;
  --rose: #ff6fb1;
  --panel: rgba(16, 24, 70, .72);
  --f-disp: 'Dela Gothic One', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', system-ui, sans-serif;
  --f-body: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', system-ui, sans-serif;
  --navh: 64px;
}
html { height: 100%; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--night); }
*, *::before, *::after { box-sizing: border-box; }
body {
  height: 100%; margin: 0; background: var(--night); color: var(--ink);
  font-family: var(--f-body); font-size: 14px; overflow: hidden;
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
  touch-action: manipulation; -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; color: inherit; cursor: pointer; -webkit-appearance: none; appearance: none; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
img { max-width: 100%; -webkit-user-drag: none; }
[hidden] { display: none !important; }

#app { position: relative; height: 100%; overflow: hidden; isolation: isolate; }
#bg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
#fx { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 80; pointer-events: none; }
#flash { position: absolute; inset: 0; z-index: 79; pointer-events: none; background: #fff; opacity: 0; }

/* ===== 画面 ===== */
.screen { position: absolute; inset: 0; z-index: 2; display: none; flex-direction: column; }
.screen.active { display: flex; animation: scrIn .42s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes scrIn { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
.has-nav { padding-bottom: calc(var(--navh) + 6px); }
.scroll { overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }

.topbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px 8px; }
.topbar h2 { margin: 0; font: 400 20px/1.2 var(--f-disp); letter-spacing: .04em; flex: 1; text-wrap: balance; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(255, 255, 255, .08); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .18); display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 22px; height: 22px; }

/* ===== ボタン ===== */
.btn {
  font: 800 15px/1 var(--f-body); letter-spacing: .04em; padding: 14px 24px; border-radius: 999px; border: none;
  color: #2a1a06; background: linear-gradient(180deg, #fff6d4, var(--gold) 55%, #f5b73a);
  box-shadow: 0 4px 0 var(--gold-d), 0 10px 24px rgba(255, 190, 70, .28); transition: transform .08s, box-shadow .08s, filter .2s;
  position: relative; overflow: hidden;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-d), 0 4px 12px rgba(255, 190, 70, .2); }
.btn[disabled] { filter: grayscale(1) brightness(.6); pointer-events: none; }
.btn.ghost { background: rgba(255, 255, 255, .07); color: var(--ink); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .22); }
.btn.ghost:active { box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .4); }
.btn.cyan { background: linear-gradient(180deg, #e8feff, var(--cyan) 55%, #3fcfe8); color: #06283a; box-shadow: 0 4px 0 #1c8aa8, 0 10px 24px rgba(80, 220, 255, .28); }
.btn.big { font-size: 18px; padding: 18px 34px; }
.btn.sm { font-size: 13px; padding: 9px 14px; }
.btn.shimmer::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .7) 50%, transparent 70%); transform: translateX(-120%); animation: shim 2.8s ease-in-out infinite; }
@keyframes shim { 60%, 100% { transform: translateX(120%); } }

.chip { border: none; border-radius: 999px; padding: 7px 12px; font: 700 12px/1 var(--f-body); background: rgba(255, 255, 255, .07); color: var(--mute); box-shadow: inset 0 0 0 1.2px rgba(255, 255, 255, .14); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.chip.on { background: rgba(126, 243, 255, .16); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--cyan); }
.chip .ico { width: 16px; height: 16px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 16px 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }

/* ===== ナビ ===== */
#nav {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 20; height: var(--navh);
  display: flex; justify-content: space-around; align-items: stretch; padding: 0 8px;
  background: linear-gradient(180deg, rgba(8, 12, 38, .6), rgba(8, 12, 38, .96)); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
}
body[data-screen="title"] #nav, body[data-screen="packs"] #nav, body[data-screen="battle"] #nav, body[data-screen="deckedit"] #nav { display: none; }
#nav button { flex: 1; border: none; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 700 11px var(--f-body); color: var(--mute); position: relative; }
#nav button svg { width: 24px; height: 24px; transition: transform .25s; }
#nav button.on { color: var(--ink); }
#nav button.on svg { transform: translateY(-2px) scale(1.12); filter: drop-shadow(0 0 8px rgba(126, 243, 255, .8)); }
#nav button.on::before { content: ''; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }

/* ===== タイトル ===== */
#scr-title { align-items: center; justify-content: center; gap: 18px; text-align: center; cursor: pointer; }
.logo { font: 400 clamp(38px, 12vw, 64px)/1 var(--f-disp); letter-spacing: .02em; position: relative; margin: 0; }
.logo span.l { background: linear-gradient(180deg, #fffbe6 10%, #ffd46a 50%, #ff9d4a 90%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 #7a3a10) drop-shadow(0 0 22px rgba(255, 200, 90, .45)); }
.logo::after { content: attr(data-text); position: absolute; inset: 0; background: linear-gradient(100deg, transparent 40%, rgba(255, 255, 255, .95) 50%, transparent 60%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: logoShine 3.4s ease-in-out infinite; }
@keyframes logoShine { 0% { background-position: 150% 0; } 55%, 100% { background-position: -60% 0; } }
.logo-sub { font: 800 13px var(--f-body); letter-spacing: .5em; color: var(--cyan); text-shadow: 0 0 12px rgba(126, 243, 255, .6); margin: 0; padding-left: .5em; }
.tap-start { margin-top: 40px; font: 400 16px var(--f-disp); letter-spacing: .3em; animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .25; } }
.title-note { position: absolute; bottom: 18px; left: 16px; right: 16px; font-size: 11px; color: var(--mute); }
.title-cards { position: relative; height: 150px; width: 260px; margin-top: 10px; }
.title-cards .card { position: absolute; left: 50%; top: 0; --cw: 100px; transform-origin: 50% 130%; }

/* ===== ホーム ===== */
#scr-home .home { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 8px 16px 0; gap: 10px; min-height: 0; }
.home-head { width: 100%; display: flex; align-items: center; justify-content: space-between; }
.home-logo { font: 400 26px/1 var(--f-disp); }
.home-logo span { background: linear-gradient(180deg, #fffbe6, #ffd46a 55%, #ff9d4a); -webkit-background-clip: text; background-clip: text; color: transparent; }
.showcase { position: relative; flex: 1; width: 100%; min-height: 220px; display: grid; place-items: center; perspective: 1000px; }
.showcase .pack { position: absolute; cursor: pointer; transition: transform .5s cubic-bezier(.2, .8, .2, 1); }
.home-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 460px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 8px; text-align: center; display: flex; flex-direction: column; gap: 4px; }
.stat b { font: 400 20px/1 var(--f-disp); font-variant-numeric: tabular-nums; }
.stat small { color: var(--mute); font-size: 11px; font-weight: 700; }
.home-cta { display: flex; flex-direction: column; align-items: center; gap: 8px; padding-bottom: 12px; }
.hint { font-size: 12px; color: var(--mute); text-align: center; }

/* ===== パック ===== */
.pack { --pw: 200px; width: var(--pw); aspect-ratio: .62; position: relative; container-type: inline-size; flex: none; }
.pack-part { position: absolute; left: 0; right: 0; overflow: hidden; }
.pack-top { top: 0; height: 14%; z-index: 2; }
.pack-body { top: 14%; bottom: 0; z-index: 3; }
.pack-skin { position: absolute; left: 0; right: 0; height: 161.3cqw; background: linear-gradient(165deg, var(--p0), var(--p1) 48%, var(--p2)); }
.pack-body .pack-skin { top: -22.58cqw; }
.pack-top .pack-skin { top: 0; }
.pack-skin::before { content: ''; position: absolute; inset: 0; background:
  repeating-linear-gradient(90deg, rgba(255, 255, 255, .22) 0 1.2cqw, transparent 1.2cqw 2.6cqw) top / 100% 7cqw no-repeat,
  repeating-linear-gradient(90deg, rgba(255, 255, 255, .22) 0 1.2cqw, transparent 1.2cqw 2.6cqw) bottom / 100% 6cqw no-repeat,
  repeating-linear-gradient(125deg, rgba(255, 255, 255, .07) 0 3cqw, transparent 3cqw 9cqw); }
.pack-skin .p-ring { position: absolute; left: 50%; top: 58%; width: 120cqw; height: 120cqw; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, .55) 0%, rgba(255, 255, 255, .12) 38%, transparent 62%); }
.pack-skin .p-rays { position: absolute; left: 50%; top: 58%; width: 190cqw; height: 190cqw; transform: translate(-50%, -50%); background: repeating-conic-gradient(from 0deg, rgba(255, 255, 255, .13) 0 6deg, transparent 6deg 15deg); -webkit-mask: radial-gradient(circle, #000 20%, transparent 62%); mask: radial-gradient(circle, #000 20%, transparent 62%); }
.pack-skin img.p-mon { position: absolute; left: -8%; width: 116%; top: 34%; filter: drop-shadow(0 2cqw 3cqw rgba(0, 0, 0, .35)); }
.pack-skin .p-logo { position: absolute; top: 17.5%; left: 0; right: 0; text-align: center; font: 400 11.2cqw/1 var(--f-disp); letter-spacing: -.01em; color: #fff; text-shadow: 0 .8cqw 0 rgba(0, 0, 0, .35), 0 0 6cqw rgba(255, 255, 255, .5); }
.pack-skin .p-set { position: absolute; top: 29%; left: 0; right: 0; text-align: center; font: 800 5cqw/1 var(--f-body); letter-spacing: .15em; color: rgba(255, 255, 255, .9); }
.pack-skin .p-name { position: absolute; bottom: 12%; left: 6%; right: 6%; text-align: center; font: 400 10cqw/1.1 var(--f-disp); color: #fff; text-shadow: 0 .8cqw 0 rgba(0, 0, 0, .4); }
.pack-skin .p-count { position: absolute; bottom: 6.5%; left: 0; right: 0; text-align: center; font: 800 4.4cqw/1 var(--f-body); letter-spacing: .3em; color: rgba(255, 255, 255, .85); }
.pack-skin .p-en { position: absolute; top: 9%; left: 0; right: 0; text-align: center; font: 800 4.2cqw/1 var(--f-body); letter-spacing: .6em; color: rgba(255, 255, 255, .7); padding-left: .6em; }
.pack-sheen { position: absolute; inset: 0; z-index: 5; pointer-events: none; mix-blend-mode: overlay;
  background: linear-gradient(115deg, transparent 20%, rgba(255, 255, 255, .75) calc(var(--sx, 30%) - 6%), rgba(255, 255, 255, .0) calc(var(--sx, 30%) + 10%), transparent 90%); }
.pack-foil { position: absolute; inset: 0; z-index: 4; pointer-events: none; mix-blend-mode: color-dodge; opacity: .35;
  background: repeating-linear-gradient(120deg, #ff8a8a 0%, #ffe68a 6%, #8affb0 12%, #8ae6ff 18%, #c58aff 24%, #ff8a8a 30%); background-size: 300% 300%; background-position: var(--sx, 30%) 50%; filter: brightness(.6) contrast(1.4); }
.pack-shadow { position: absolute; left: 8%; right: 8%; bottom: -7%; height: 7%; border-radius: 50%; background: radial-gradient(rgba(0, 0, 0, .55), transparent 70%); z-index: 0; }

.float { animation: floaty 4s ease-in-out infinite; }
@keyframes floaty { 50% { transform: translateY(-8px) rotate(.6deg); } }

/* パック選択 */
#scr-packs { background: radial-gradient(ellipse at 50% 45%, var(--sel-c, #2a3a9a) 0%, rgba(6, 10, 29, 0) 70%); transition: background .5s; }
.pk-carousel { flex: 1; display: flex; align-items: center; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 0 calc(50% - 110px); gap: 20px; min-height: 0; perspective: 1000px; }
.pk-carousel::-webkit-scrollbar { display: none; }
.pk-slot { scroll-snap-align: center; flex: none; display: grid; place-items: center; transition: transform .35s, opacity .35s, filter .35s; }
.pk-slot .pack { --pw: min(220px, 56vw, 32vh); }
.pk-slot:not(.on) { transform: scale(.82); opacity: .55; filter: saturate(.6); }
.pk-info { text-align: center; padding: 6px 16px 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.pk-info h3 { margin: 0; font: 400 22px var(--f-disp); }
.pk-rates { font-size: 11px; color: var(--mute); display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.pk-feature { display: flex; gap: 6px; justify-content: center; }
.pk-feature .card { --cw: 58px; }

/* 開封ステージ */
#open-stage { position: absolute; inset: 0; z-index: 40; background: radial-gradient(ellipse at 50% 42%, var(--st-c, #3a2a9a) 0%, #070a1e 72%); overflow: hidden; touch-action: none; }
#open-stage .stage-rays { position: absolute; left: 50%; top: 42%; width: 200vmax; height: 200vmax; transform: translate(-50%, -50%); background: repeating-conic-gradient(from 0deg, rgba(255, 255, 255, .05) 0 5deg, transparent 5deg 14deg); animation: spin 60s linear infinite; pointer-events: none; }
@keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
.op-pack { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); }
.op-pack .pack { --pw: min(260px, 64vw, 40vh); }
.tear-guide { position: absolute; left: -4%; right: -4%; top: 14%; height: 0; z-index: 6; pointer-events: none; }
.tear-guide::before { content: ''; position: absolute; left: 0; right: 0; top: -1px; border-top: 2px dashed rgba(255, 255, 255, .85); filter: drop-shadow(0 0 4px #fff); }
.tear-finger { position: absolute; top: -8px; left: 0; width: 34px; height: 34px; animation: finger 1.8s ease-in-out infinite; }
@keyframes finger { 0% { transform: translateX(-10%); opacity: 0; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateX(calc(min(260px, 64vw, 40vh) * 1.02)); opacity: 0; } }
.tear-glow { position: absolute; top: calc(14% - 3px); height: 6px; left: 0; width: 0; z-index: 7; border-radius: 3px; pointer-events: none;
  background: linear-gradient(90deg, #fff, var(--tg, #bff6ff), #fff); box-shadow: 0 0 10px #fff, 0 0 26px var(--tg, #7ef3ff), 0 0 50px var(--tg, #7ef3ff); }
.op-msg { position: absolute; left: 0; right: 0; bottom: 9%; text-align: center; font: 400 18px var(--f-disp); letter-spacing: .12em; text-shadow: 0 2px 10px rgba(0, 0, 0, .6); pointer-events: none; }
.op-msg small { display: block; font: 700 12px var(--f-body); color: var(--mute); letter-spacing: .05em; margin-top: 6px; }
.op-skip { position: absolute; top: 12px; right: 12px; z-index: 50; }
.top-fly { animation: topFly .9s cubic-bezier(.3, .6, .4, 1) forwards; }
@keyframes topFly { 0% { transform: none; } 30% { transform: translate(6%, -40%) rotate(-6deg); } 100% { transform: translate(60%, -420%) rotate(38deg); opacity: 0; } }
.body-drop { animation: bodyDrop .7s cubic-bezier(.5, 0, .7, .4) forwards; }
@keyframes bodyDrop { to { transform: translateY(120%); opacity: 0; } }
.pack-shake { animation: pshake .45s linear; }
@keyframes pshake { 20% { transform: translateX(-3px) rotate(-1deg); } 40% { transform: translateX(3px) rotate(1deg); } 60% { transform: translateX(-2px); } 80% { transform: translateX(2px); } }
.light-spill { position: absolute; left: 8%; right: 8%; top: 12%; height: 6%; z-index: 1; border-radius: 50%; background: radial-gradient(ellipse, #fff 0%, var(--tg, #bff6ff) 40%, transparent 70%); filter: blur(4px); opacity: 0; }

.reveal { position: absolute; inset: 0; z-index: 45; }
.rv-stack { position: absolute; left: 50%; top: 45%; width: var(--rw); aspect-ratio: 63/88; transform: translate(-50%, -50%); }
.rv { position: absolute; inset: 0; will-change: transform; }
.rv .card { --cw: var(--rw); }
.rv-count { position: absolute; left: 0; right: 0; bottom: 6%; text-align: center; font: 400 15px var(--f-disp); letter-spacing: .2em; color: var(--mute); }
.rv-hint { position: absolute; left: 0; right: 0; bottom: calc(6% + 26px); text-align: center; font-size: 12px; font-weight: 700; color: var(--mute); }
.rv-glow { position: absolute; inset: -6%; border-radius: 8%; background: conic-gradient(from var(--a, 0deg), #ff6fb1, #ffd46a, #7ef3ff, #b173ff, #ff6fb1); filter: blur(14px); opacity: .9; animation: glowSpin 2s linear infinite; z-index: -1; }
@property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
@keyframes glowSpin { to { --a: 360deg; } }
.sealed .card { animation: sealPulse 1s ease-in-out infinite; }
@keyframes sealPulse { 50% { transform: scale(1.025); } }
.rar-banner { position: absolute; left: 0; right: 0; top: 9%; text-align: center; font: 400 26px var(--f-disp); letter-spacing: .1em; pointer-events: none; z-index: 5; }
.rar-banner span { background: linear-gradient(180deg, #fff, var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .4)) drop-shadow(0 0 14px rgba(255, 210, 110, .7)); }
.new-badge { position: absolute; top: -2.5%; right: -3%; z-index: 10; background: linear-gradient(180deg, #ff7aa6, #ff2a64); color: #fff; font: 400 14px/1 var(--f-disp); padding: 6px 11px 7px; border-radius: 999px; box-shadow: 0 3px 0 #a0103a, 0 0 18px rgba(255, 60, 120, .6); transform: rotate(10deg); animation: badgePop .5s cubic-bezier(.3, 1.6, .5, 1) both; pointer-events: none; }
@keyframes badgePop { from { transform: rotate(10deg) scale(0); } }
.god-banner { position: absolute; left: 0; right: 0; top: 14%; z-index: 8; text-align: center; font: 400 30px var(--f-disp); letter-spacing: .08em; pointer-events: none; }
.god-banner span { background: linear-gradient(90deg, #ff6fb1, #ffd46a, #7ef3ff, #b173ff, #ff6fb1); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: rainbowMove 1.5s linear infinite; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .5)); }
@keyframes rainbowMove { to { background-position: 200% 0; } }

.summary { position: absolute; inset: 0; z-index: 46; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 16px; }
.summary h3 { margin: 0; font: 400 22px var(--f-disp); letter-spacing: .1em; }
.sum-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; max-width: 520px; }
.sum-grid .sum-item { position: relative; cursor: pointer; }
.sum-grid .card { --cw: min(28vw, 140px, 17vh); }
.sum-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

/* ===== 図鑑 ===== */
.dex-head { padding: 0 16px 8px; display: flex; flex-direction: column; gap: 8px; }
.progress { height: 10px; border-radius: 99px; background: rgba(255, 255, 255, .08); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.progress i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--cyan), #b173ff, var(--rose)); box-shadow: 0 0 12px rgba(126, 243, 255, .6); transition: width .8s cubic-bezier(.2, .8, .2, 1); }
.dex-count { display: flex; align-items: baseline; gap: 8px; }
.dex-count b { font: 400 26px var(--f-disp); font-variant-numeric: tabular-nums; }
.dex-count span { color: var(--mute); font-weight: 700; }
.pack-prog { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font-size: 11px; color: var(--mute); font-weight: 700; }
.pack-prog div { display: flex; flex-direction: column; gap: 3px; }
.pack-prog .progress { height: 5px; }
.dex-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 10px; padding: 4px 16px 20px; }
@media (min-width: 560px) { .dex-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (min-width: 820px) { .dex-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.dex-item { position: relative; cursor: pointer; }
.dex-item .card { --cw: 100%; }
.dex-item .cnt { position: absolute; right: -4px; bottom: -6px; z-index: 5; background: #fff; color: #1a1030; font: 800 11px/1 var(--f-body); padding: 4px 7px; border-radius: 99px; box-shadow: 0 2px 6px rgba(0, 0, 0, .4); }
.dex-item .newdot { position: absolute; left: -3px; top: -3px; z-index: 5; width: 12px; height: 12px; border-radius: 50%; background: var(--rose); box-shadow: 0 0 10px var(--rose); }
.locked-card { width: 100%; aspect-ratio: 63/88; border-radius: 9%/6.5%; background: linear-gradient(160deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .02)); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .1); display: grid; place-items: center; position: relative; overflow: hidden; }
.locked-card img { width: 80%; filter: brightness(0) invert(1); opacity: .08; }
.locked-card span { position: absolute; bottom: 7%; font: 800 11px var(--f-body); color: rgba(255, 255, 255, .3); letter-spacing: .1em; }

/* ===== ビューア ===== */
#viewer { position: absolute; inset: 0; z-index: 60; background: rgba(4, 6, 20, .86); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; animation: fadeIn .25s ease both; }
@keyframes fadeIn { from { opacity: 0; } }
#viewer .vw-card { --cw: min(80vw, 350px, calc(62vh * 63 / 88)); touch-action: none; }
#viewer .vw-card .card { --cw: inherit; }
.vw-info { text-align: center; display: flex; flex-direction: column; gap: 4px; }
.vw-info b { font: 400 18px var(--f-disp); }
.vw-info small { color: var(--mute); font-weight: 700; }
.vw-nav { display: flex; gap: 12px; align-items: center; }
.vw-close { position: absolute; top: 12px; right: 12px; }

/* ===== デッキ ===== */
.deck-list { display: flex; flex-direction: column; gap: 10px; padding: 4px 16px 20px; }
.deck-sec { font: 800 12px var(--f-body); color: var(--mute); letter-spacing: .15em; margin: 8px 0 0; }
.deck-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; position: relative; text-align: left; width: 100%; }
.deck-row.sel { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan), 0 0 22px rgba(126, 243, 255, .25); }
.deck-row .dr-art { width: 54px; height: 54px; border-radius: 12px; background-size: cover; background-position: center; flex: none; position: relative; overflow: hidden; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .2); }
.deck-row .dr-art img { position: absolute; inset: -10%; width: 120%; height: 120%; }
.deck-row .dr-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.deck-row .dr-main b { font: 400 15px var(--f-disp); }
.deck-row .dr-main small { color: var(--mute); font-weight: 700; font-size: 11px; display: flex; gap: 4px; align-items: center; }
.deck-row .ico { width: 18px; height: 18px; }
.deck-row .tag { font: 800 10px var(--f-body); padding: 4px 8px; border-radius: 99px; background: var(--cyan); color: #06283a; }
.deck-row .dr-edit { flex: none; padding: 8px 11px; }
.deck-row { -webkit-touch-callout: none; }

#scr-deckedit .de-top { padding: 0 16px 8px; display: flex; flex-direction: column; gap: 8px; }
.de-name { display: flex; gap: 8px; align-items: center; }
.de-name input { flex: 1; min-width: 0; font: 400 16px var(--f-disp); color: var(--ink); background: rgba(255, 255, 255, .06); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; -webkit-user-select: text; user-select: text; }
.de-count { font: 400 18px var(--f-disp); font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; }
.de-count.ok { color: #8dffb0; }
.de-energy { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--mute); font-weight: 700; }
.de-energy .chip .ico { width: 18px; height: 18px; }
.de-deck { display: flex; gap: 6px; overflow-x: auto; padding: 6px 16px 10px; min-height: 108px; scrollbar-width: thin; }
.de-deck .slotc { position: relative; flex: none; cursor: pointer; }
.de-deck .card { --cw: 64px; }
.de-deck .x { position: absolute; bottom: -5px; right: -5px; width: 18px; height: 18px; border-radius: 50%; background: #ff4a6a; color: #fff; font: 800 11px/18px var(--f-body); text-align: center; z-index: 5; }
.de-empty { color: var(--mute); font-size: 12px; align-self: center; padding: 10px; }
.de-pool { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 8px; padding: 6px 16px 20px; }
@media (min-width: 560px) { .de-pool { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.de-pool .pc { position: relative; cursor: pointer; }
.de-pool .pc .card { --cw: 100%; }
.de-pool .pc .own { position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); background: rgba(10, 14, 40, .92); border: 1px solid var(--line); color: var(--ink); font: 800 10px/1 var(--f-body); padding: 3px 6px; border-radius: 99px; white-space: nowrap; z-index: 5; }
.de-pool .pc.max { opacity: .45; }
.de-hint { font-size: 11px; color: var(--mute); font-weight: 700; margin-top: -4px; }
.de-msg { font-size: 12px; color: #ffb3c6; font-weight: 700; min-height: 16px; }
.de-actions { display: flex; gap: 8px; }
.de-actions .btn { flex: 1; }

/* ===== バトル選択 ===== */
.opp-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 4px 16px 12px; }
.foe { position: relative; border-radius: 18px; padding: 10px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.foe.sel { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 22px rgba(255, 212, 106, .25); }
.foe .av { width: 76px; height: 76px; border-radius: 50%; background-size: cover; background-position: center; position: relative; overflow: hidden; box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .25); }
.foe .av img { position: absolute; left: -12%; top: -6%; width: 124%; }
.foe b { font: 400 15px var(--f-disp); }
.foe small { color: var(--mute); font-size: 11px; font-weight: 700; display: flex; gap: 4px; align-items: center; }
.foe .ico { width: 16px; height: 16px; }
.bs-foot { padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
.bs-deck { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: rgba(255, 255, 255, .05); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.bs-deck small { color: var(--mute); font-weight: 700; display: block; font-size: 11px; }
.bs-deck b { font: 400 15px var(--f-disp); }

/* ===== 設定 ===== */
.settings { display: flex; flex-direction: column; gap: 14px; text-align: left; }
.settings label { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 13px; }
.settings input[type=range] { width: 100%; accent-color: var(--cyan); }
.settings .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 700; font-size: 13px; }

/* ===== モーダル/トースト ===== */
#modal { position: absolute; inset: 0; z-index: 90; background: rgba(3, 5, 18, .7); display: grid; place-items: center; padding: 16px; animation: fadeIn .2s both; }
.modal-box { width: min(92vw, 380px); background: linear-gradient(180deg, #1c2670, #121a52); border: 1px solid var(--line); border-radius: 22px; padding: 22px 20px 18px; box-shadow: 0 20px 60px rgba(0, 0, 0, .6); text-align: center; animation: pop .35s cubic-bezier(.3, 1.4, .5, 1) both; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } }
.modal-box h3 { margin: 0 0 8px; font: 400 19px var(--f-disp); text-wrap: balance; }
.modal-box p { margin: 0 0 18px; color: #c8d0f4; line-height: 1.6; font-size: 13px; }
.modal-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
#toast { position: absolute; left: 50%; bottom: calc(var(--navh) + 20px); transform: translate(-50%, 20px); z-index: 95; background: rgba(12, 18, 56, .95); border: 1px solid var(--line); padding: 10px 16px; border-radius: 99px; font-weight: 700; font-size: 13px; opacity: 0; pointer-events: none; transition: .3s; white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ===== ダイヤ ===== */
.gem-ico { display: inline-block; width: 18px; height: 18px; background-size: contain; background-repeat: no-repeat; vertical-align: middle; flex: none; font-style: normal; }
.gem-chip { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px 0 9px; border-radius: 999px; border: none; flex: none;
  background: linear-gradient(180deg, rgba(40, 70, 170, .7), rgba(16, 26, 80, .85)); box-shadow: inset 0 0 0 1.5px rgba(126, 243, 255, .45), 0 0 16px rgba(80, 200, 255, .15); color: var(--ink); }
.gem-chip .gem-ico { width: 22px; height: 22px; filter: drop-shadow(0 0 6px rgba(120, 230, 255, .7)); }
.gem-chip b { font: 400 16px/1 var(--f-disp); font-variant-numeric: tabular-nums; min-width: 2.5ch; text-align: right; }
.gem-fly { position: absolute; left: 0; top: 0; width: 22px; height: 22px; z-index: 96; pointer-events: none; filter: drop-shadow(0 0 8px rgba(120, 230, 255, .9)); }
.head-right { display: flex; align-items: center; gap: 8px; }
.eco-list { display: flex; flex-direction: column; gap: 6px; text-align: left; }
.eco-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: rgba(255, 255, 255, .05); font-size: 12px; font-weight: 700; }
.eco-row b { display: inline-flex; align-items: center; gap: 4px; font: 400 13px var(--f-disp); color: #bff6ff; white-space: nowrap; }
.cost-btn { display: inline-flex; align-items: center; gap: 10px; }
.cost-btn .cost { display: inline-flex; align-items: center; gap: 3px; padding: 4px 9px 4px 6px; border-radius: 999px; background: rgba(20, 30, 90, .85); color: #e8fbff; font: 400 14px/1 var(--f-disp); }
.cost-btn .cost .gem-ico { width: 18px; height: 18px; }
.cost-btn[aria-disabled="true"] { filter: saturate(.3) brightness(.75); }
.pk-btns { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
.bonus-box { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 16px; border-radius: 16px; font-size: 12px; font-weight: 700; color: #d8e6ff;
  background: rgba(16, 26, 80, .82); box-shadow: inset 0 0 0 1.5px rgba(126, 243, 255, .4); }
.bonus-box > b { font: 400 13px var(--f-disp); color: var(--cyan); }
.bonus-total { display: flex; align-items: center; gap: 4px; font: 400 20px var(--f-disp); color: #fff; margin-top: 2px; }
.bonus-total .gem-ico { width: 22px; height: 22px; }

/* ログインボーナス */
.login-box h3 { font-size: 22px; }
.login-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin: 4px 0 12px; }
.ld { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; border-radius: 10px; background: rgba(255, 255, 255, .05); font-weight: 700; }
.ld small { font-size: 9px; color: var(--mute); white-space: nowrap; }
.ld b { font: 400 11px var(--f-disp); }
.ld .gem-ico { width: 16px; height: 16px; }
.ld.got { opacity: .45; }
.ld.now { background: rgba(126, 243, 255, .16); box-shadow: inset 0 0 0 1.5px var(--cyan), 0 0 14px rgba(126, 243, 255, .35); }
.login-amount { display: flex; align-items: center; justify-content: center; gap: 6px; font: 400 34px var(--f-disp); margin-bottom: 8px; background: linear-gradient(180deg, #fff, #9af0ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.login-amount .gem-ico { width: 34px; height: 34px; }
.login-note { font-size: 12px !important; color: var(--gold) !important; margin: -4px 0 12px !important; }
/* プレゼント */
.gift-gem { position: relative; width: 96px; height: 96px; margin: 4px auto 2px; display: grid; place-items: center; }
.gift-gem::before { content: ''; position: absolute; inset: -22px; border-radius: 50%; background: repeating-conic-gradient(rgba(160, 240, 255, .32) 0 9deg, transparent 9deg 30deg); -webkit-mask: radial-gradient(closest-side, #000 35%, transparent); mask: radial-gradient(closest-side, #000 35%, transparent); animation: gift-spin 10s linear infinite; }
.gift-gem .gem-ico { position: relative; width: 76px; height: 76px; filter: drop-shadow(0 0 16px rgba(120, 230, 255, .85)); animation: gift-float 2.4s ease-in-out infinite; }
@keyframes gift-spin { to { transform: rotate(360deg); } }
@keyframes gift-float { 50% { transform: translateY(-6px) scale(1.04); } }
@media (prefers-reduced-motion: reduce) { .gift-gem::before, .gift-gem .gem-ico { animation: none; } }

/* 確率の詳細 */
.odds-box { width: min(94vw, 460px); max-height: 86vh; display: flex; flex-direction: column; text-align: left; }
.odds-box h3, .odds-box > p { text-align: center; }
.odds-box > p { margin-bottom: 10px; }
.odds-scroll { overflow-y: auto; min-height: 0; flex: 1; -webkit-overflow-scrolling: touch; padding-right: 2px; }
.odds-tablewrap { overflow-x: auto; }
.odds-table { width: 100%; border-collapse: collapse; font-size: 11px; font-variant-numeric: tabular-nums; }
.odds-table th { font-weight: 800; color: var(--mute); padding: 6px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.odds-table td { padding: 6px 4px; border-bottom: 1px solid rgba(170, 190, 255, .08); text-align: center; white-space: nowrap; }
.odds-table td:first-child { text-align: left; font-weight: 700; }
.odds-table td b { color: var(--cyan); }
.odds-table .rar, .odds-list .rar { container-type: normal; font-size: 0; vertical-align: middle; }
.odds-table .rar b, .odds-list .rar b { width: 8px; height: 8px; margin-right: 1px; display: inline-block; }
.odds-table .rar-RR b, .odds-table .rar-AR b, .odds-table .rar-SR b, .odds-list .rar-RR b, .odds-list .rar-AR b, .odds-list .rar-SR b { width: 11px; height: 11px; }
.odds-table .rar-UR b, .odds-list .rar-UR b { width: 13px; height: 11px; }
.odds-note { font-size: 11px; color: var(--mute); line-height: 1.6; margin: 10px 0 6px; }
.odds-list h4 { margin: 14px 0 6px; font: 400 13px var(--f-disp); display: flex; align-items: center; gap: 4px; }
.odds-row { display: flex; align-items: center; gap: 10px; padding: 5px 4px; border-bottom: 1px solid rgba(170, 190, 255, .07); font-size: 12px; font-weight: 700; }
.odds-row .on { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.odds-row .on small { font-size: 9px; color: var(--mute); }
.odds-row > b { font: 400 13px var(--f-disp); color: #e8fbff; font-variant-numeric: tabular-nums; white-space: nowrap; }
.odds-row.unown { opacity: .55; }
.odds-thumb { width: 42px; height: 30px; border-radius: 6px; background-size: cover; background-position: center; position: relative; overflow: hidden; flex: none; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .2); }
.odds-thumb img { position: absolute; inset: -10%; width: 120%; height: 120%; }

/* バトル選択の★と報酬 */
.foe-meta { display: flex; gap: 8px; align-items: center; font: 800 11px var(--f-body); }
.foe-meta .stars { color: var(--gold); letter-spacing: 1px; }
.foe-meta .rw { display: inline-flex; align-items: center; gap: 2px; color: #bff6ff; }
.foe-meta .gem-ico { width: 14px; height: 14px; }
.result .reward { display: flex; align-items: center; gap: 12px; }
.result .rw-add { display: inline-flex; align-items: center; gap: 4px; font: 400 22px var(--f-disp); color: #bff6ff; }
.result .rw-add .gem-ico { width: 24px; height: 24px; }

.odds-table th.wrap { white-space: normal; min-width: 64px; line-height: 1.3; }

/* ===== オンライン対戦 ===== */
.online-entry { width: calc(100% - 32px); margin: 0 16px 12px; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 18px; border: none; text-align: left;
  background: linear-gradient(120deg, rgba(47, 184, 255, .28), rgba(177, 115, 255, .28)); box-shadow: inset 0 0 0 1.5px rgba(126, 243, 255, .5), 0 0 24px rgba(126, 243, 255, .15); }
.online-entry .oe-ico { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgba(126, 243, 255, .18); color: var(--cyan); flex: none; }
.online-entry .oe-ico svg { width: 24px; height: 24px; }
.online-entry .oe-t { flex: 1; display: flex; flex-direction: column; gap: 3px; }
.online-entry .oe-t b { font: 400 17px var(--f-disp); }
.online-entry .oe-t small { color: #c8d4f6; font-weight: 700; font-size: 11px; }
.online-entry .oe-go { font: 400 28px var(--f-disp); color: var(--cyan); }
.online { padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 12px; }
.on-card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.on-card h3 { margin: 0; font: 400 17px var(--f-disp); }
.on-card p { margin: 0; color: #c8d0f4; font-size: 12px; line-height: 1.6; }
.on-field { display: flex; flex-direction: column; gap: 6px; font-size: 11px; font-weight: 700; color: var(--mute); }
.on-field input, .on-join input { font: 400 16px var(--f-disp); color: var(--ink); background: rgba(255, 255, 255, .06); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; -webkit-user-select: text; user-select: text; min-width: 0; }
.on-join { display: flex; gap: 8px; }
.on-join input { flex: 1; letter-spacing: .35em; text-transform: uppercase; text-align: center; font-size: 22px; }
.on-msg { min-height: 18px; font-size: 12px; font-weight: 700; color: #ffc6d6; text-align: center; }
.on-note { text-align: left !important; line-height: 1.6; }
.on-card.wait { align-items: center; text-align: center; padding: 22px 14px; }
.on-lead { font-weight: 800 !important; color: var(--ink) !important; }
.code-big { display: flex; gap: 6px; }
.code-big span { width: 50px; height: 62px; display: grid; place-items: center; border-radius: 12px; font: 400 32px var(--f-disp); color: #fff;
  background: linear-gradient(180deg, #2a3aa0, #141c5a); box-shadow: inset 0 0 0 2px rgba(126, 243, 255, .55), 0 0 18px rgba(126, 243, 255, .25); -webkit-user-select: text; user-select: text; }
.on-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.on-wait { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 13px; }
.dots { display: inline-flex; gap: 4px; }
.dots b { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); animation: dotb 1.2s ease-in-out infinite; }
.dots b:nth-child(2) { animation-delay: .15s; } .dots b:nth-child(3) { animation-delay: .3s; }
@keyframes dotb { 0%, 80%, 100% { opacity: .25; transform: scale(.7); } 40% { opacity: 1; transform: scale(1); } }
.net-warn { position: absolute; left: 12px; right: 12px; top: 50%; transform: translateY(-50%); z-index: 45; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
  padding: 16px; border-radius: 18px; background: rgba(14, 20, 62, .96); border: 1.5px solid rgba(255, 180, 120, .6); box-shadow: 0 16px 40px rgba(0, 0, 0, .6); }
.net-warn b { font: 400 16px var(--f-disp); color: #ffd8b0; }
.net-warn span { font-size: 12px; color: #d8def8; font-weight: 700; }

/* ===== カード ===== */
.t-leaf   { --c1: #e6fbcc; --c2: #6fd35a; --c3: #2a8638; --pale: #f1fce6; --tx: #173a1c; }
.t-fire   { --c1: #ffe4c8; --c2: #ff7a45; --c3: #b8321f; --pale: #fff3ea; --tx: #3d1408; }
.t-water  { --c1: #dcf3ff; --c2: #4aabff; --c3: #1a56b8; --pale: #edf7ff; --tx: #0c2a52; }
.t-spark  { --c1: #fff8d0; --c2: #ffd23a; --c3: #b88400; --pale: #fffbea; --tx: #3a2a00; }
.t-mystic { --c1: #f1e4ff; --c2: #b07cff; --c3: #5d33b8; --pale: #f7f1ff; --tx: #2a1152; }
.t-stone  { --c1: #f6e4ce; --c2: #d4935a; --c3: #7f4b28; --pale: #fcf4ea; --tx: #3a1f0c; }
.t-any    { --c1: #ffffff; --c2: #d8d1bd; --c3: #8a826a; --pale: #fcfbf7; --tx: #2c2818; }
.t-trainer{ --c1: #e8fbf8; --c2: #7fd6ca; --c3: #2b7f78; --pale: #f2fcfa; --tx: #0f3330; }

.card {
  --cw: 200px; --rx: 0deg; --ry: 0deg; --mx: 50%; --my: 50%; --bgx: 50%; --bgy: 50%; --hyp: 0; --o: 0;
  width: var(--cw); aspect-ratio: 63 / 88; position: relative; container-type: inline-size; perspective: 900px; flex: none;
  -webkit-user-select: none; user-select: none;
}
.card-rot { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateY(var(--ry)) rotateX(var(--rx)); transition: transform .55s cubic-bezier(.2, .8, .2, 1); }
.card.flipped .card-rot { transform: rotateY(calc(180deg + var(--ry))) rotateX(var(--rx)); }
.card.live .card-rot { transition: none; }
.card-face, .card-back { position: absolute; inset: 0; border-radius: 4.6cqw; overflow: hidden; -webkit-backface-visibility: hidden; backface-visibility: hidden; }
.card-face { background: linear-gradient(150deg, var(--c1), var(--c2) 42%, var(--c3)); isolation: isolate; box-shadow: 0 .8cqw 2.6cqw rgba(0, 0, 0, .38), inset 0 0 0 .5cqw rgba(255, 255, 255, .35); }
.card-back { transform: rotateY(180deg); background-color: #141a5a; background-size: cover; background-position: center; box-shadow: 0 .8cqw 2.6cqw rgba(0, 0, 0, .38); }
.only-back .card-face { display: none; }

.cf { position: absolute; inset: 2.6cqw; border-radius: 3cqw; display: flex; flex-direction: column; gap: 1.1cqw; padding: 1.6cqw 2.4cqw 1.4cqw; color: var(--tx);
  background: linear-gradient(180deg, rgba(255, 255, 255, .78), rgba(255, 255, 255, .45) 30%, rgba(255, 255, 255, .6)), var(--pale);
  box-shadow: inset 0 0 0 .35cqw rgba(0, 0, 0, .12); overflow: hidden; line-height: 1.25; }
.cf-head { display: flex; align-items: center; gap: 1.4cqw; min-height: 8.6cqw; }
.cf-stage { font: 800 2.9cqw/1 var(--f-body); padding: .8cqw 1.6cqw; border-radius: 3cqw; background: linear-gradient(180deg, #fff, #e6e1d6); color: #4a4436; box-shadow: 0 0 0 .3cqw rgba(0, 0, 0, .15); white-space: nowrap; flex: none; }
.cf-stage.tr-item { background: linear-gradient(180deg, #e2f4ff, #9fd2ff); color: #0d3a6a; }
.cf-stage.tr-supporter { background: linear-gradient(180deg, #ffe8d6, #ffb27a); color: #6a2a0a; }
.cf-name { font: 400 6.2cqw/1.05 var(--f-disp); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.01em; }
.prime-mark { display: inline-block; margin-left: .6cqw; font-size: 1.1em; background: linear-gradient(135deg, #fff 0%, #9ae6ff 30%, #ff9ae0 60%, #ffe07a 90%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 .3cqw 0 rgba(0, 0, 0, .35)); }
.cf-hp { font: 400 6.4cqw/1 var(--f-disp); color: #c4213c; white-space: nowrap; flex: none; }
.cf-hp small { font: 800 2.8cqw var(--f-body); margin-right: .5cqw; vertical-align: .6cqw; }
.ico { display: inline-block; width: 5.2cqw; height: 5.2cqw; background-size: contain; background-repeat: no-repeat; vertical-align: middle; flex: none; font-style: normal; }
.cf-head .ico { width: 6.6cqw; height: 6.6cqw; }
.cf-art { position: relative; aspect-ratio: 240 / 170; flex: none; border-radius: 1.4cqw; background-size: cover; background-position: center; overflow: hidden;
  border: .95cqw solid #efe9d8; border-color: #fbf8ef #c9c1aa #b5ad96 #e7e0cc; box-shadow: 0 .4cqw 1cqw rgba(0, 0, 0, .25); }
.r-R .cf-art, .prime .cf-art { border-color: #fff1b8 #d6a53a #b8821a #f3d27a; }
.cf-art img.mon { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
.cf-art .aura { position: absolute; inset: -20%; background: radial-gradient(circle at 50% 55%, rgba(255, 255, 255, .85), var(--c2) 30%, transparent 62%), repeating-conic-gradient(from 0deg at 50% 55%, rgba(255, 255, 255, .3) 0 5deg, transparent 5deg 15deg); opacity: .5; mix-blend-mode: screen; }
.cf-sub { font: 700 2.4cqw/1 var(--f-body); display: flex; justify-content: space-between; gap: 2cqw; padding: .5cqw 1.2cqw; margin-top: -.3cqw; border-radius: 1cqw; background: linear-gradient(90deg, rgba(255, 255, 255, .0), rgba(255, 255, 255, .75) 20%, rgba(255, 255, 255, .75) 80%, rgba(255, 255, 255, 0)); color: #6a6456; min-height: 3.4cqw; }
.cf-atks { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 1.8cqw; min-height: 0; }
.atk-row { display: flex; align-items: center; gap: 1.4cqw; }
.cost { display: flex; gap: .35cqw; min-width: 17cqw; flex: none; }
.atk-name { font: 800 4.5cqw/1.1 var(--f-body); flex: 1; min-width: 0; }
.atk-dmg { font: 400 6cqw/1 var(--f-disp); font-style: normal; white-space: nowrap; }
.atk-text { font: 500 2.75cqw/1.38 var(--f-body); margin-top: .5cqw; }
.cf-rule { font: 700 2.3cqw/1.35 var(--f-body); background: rgba(255, 255, 255, .6); border-radius: 1cqw; padding: .7cqw 1.4cqw; box-shadow: inset 0 0 0 .25cqw rgba(0, 0, 0, .1); }
.cf-rule b { margin-right: 1cqw; color: #7a38d0; }
.cf-rule.tr { color: #4a5a58; font-weight: 500; }
.cf-foot { display: flex; justify-content: space-between; align-items: center; font: 800 2.7cqw/1 var(--f-body); border-top: .3cqw solid rgba(0, 0, 0, .12); padding-top: 1.1cqw; }
.cf-foot span { display: flex; align-items: center; gap: .6cqw; }
.cf-foot .ico { width: 4.2cqw; height: 4.2cqw; }
.cf-flavor { font: 500 2.25cqw/1.4 var(--f-body); opacity: .82; border: .25cqw solid rgba(0, 0, 0, .12); border-radius: 1cqw; padding: .6cqw 1.3cqw; }
.cf-trtext { flex: 1; font: 700 3.5cqw/1.5 var(--f-body); padding: 1.4cqw .6cqw; display: flex; align-items: center; }
.cf-meta { display: flex; justify-content: space-between; align-items: center; font: 800 2.2cqw/1 var(--f-body); opacity: .75; }
.rar { display: inline-flex; gap: .7cqw; align-items: center; }
.rar b { display: block; width: 2.3cqw; height: 2.3cqw; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #a9afc6 70%, #6a7090); box-shadow: 0 0 0 .25cqw rgba(0, 0, 0, .3); }
.rar-RR b, .rar-AR b, .rar-SR b { width: 3.3cqw; height: 3.3cqw; border-radius: 0; box-shadow: none; clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%); }
.rar-RR b { background: linear-gradient(135deg, #fff, #9fb2e8 60%, #6a7cc0); }
.rar-AR b, .rar-SR b { background: linear-gradient(135deg, #fffbe0, #ffcc40 55%, #c98a10); }
.rar-UR b { width: 3.8cqw; height: 3.2cqw; clip-path: polygon(0 100%, 0 22%, 26% 55%, 50% 5%, 74% 55%, 100% 22%, 100% 100%); background: linear-gradient(180deg, #fff6c0, #ffc53a 55%, #b77a0a); }

/* ---- フルアート(AR/SR/UR) ---- */
.full .card-face { background: linear-gradient(150deg, #fdfdff, #c9cfe0 45%, #8a93ad); }
.r-SR .card-face { background: linear-gradient(150deg, #fff4fb, #ffb0e0 30%, #a8e8ff 60%, #fff0b0); }
.r-UR .card-face { background: linear-gradient(150deg, #fff7cc, #e8b030 40%, #fff0a8 60%, #a8740a); }
.full .cf { inset: 1.8cqw; padding: 1.8cqw 2.4cqw 1.6cqw; background: none; box-shadow: none; color: #fff; gap: 1cqw; }
.full .cf-art { position: absolute; inset: 0; aspect-ratio: auto; border: none; border-radius: 3cqw; box-shadow: none; z-index: 0; }
.full .cf-art img.mon { inset: auto; left: -8%; width: 116%; top: 16%; height: auto; }
.r-AR .cf-art img.mon { left: -14%; width: 128%; top: 13%; }
.full .cf > :not(.cf-art) { position: relative; z-index: 2; }
.full .cf-head { color: #fff; text-shadow: 0 .4cqw .9cqw rgba(0, 0, 0, .55), 0 0 .4cqw rgba(0, 0, 0, .5); }
.full .cf-hp { color: #fff; }
.full .cf-atks { flex: none; margin-top: auto; background: rgba(18, 12, 40, .42); backdrop-filter: blur(1.5px); -webkit-backdrop-filter: blur(1.5px); border-radius: 2.2cqw; padding: 1.8cqw 2.2cqw; }
.full .cf-rule { background: rgba(18, 12, 40, .42); color: #fff; box-shadow: none; }
.full .cf-rule b { color: #ffd8fb; }
.full .cf-foot { color: #fff; border-color: rgba(255, 255, 255, .3); text-shadow: 0 .3cqw .6cqw rgba(0, 0, 0, .6); }
.full .cf-meta { color: #fff; opacity: .9; text-shadow: 0 .3cqw .6cqw rgba(0, 0, 0, .6); }
.r-UR .cf-art::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, #fff6c0, #e2a82a 35%, #fff0a0 55%, #b8840e 80%, #ffe890); mix-blend-mode: color; pointer-events: none; }
.r-UR .cf-art img.mon { filter: contrast(1.15) brightness(1.06); }
.r-UR .cf-head, .r-UR .cf-foot, .r-UR .cf-meta { text-shadow: 0 .4cqw .8cqw rgba(90, 50, 0, .7); }
.r-UR .cf-atks, .r-UR .cf-rule { background: rgba(70, 40, 0, .42); }

/* ---- ホロ加工 ---- */
.shine, .glare { position: absolute; inset: 0; pointer-events: none; border-radius: inherit; }
.glare { z-index: 6; mix-blend-mode: overlay; opacity: calc(.15 + var(--o) * .75);
  background: radial-gradient(farthest-corner circle at var(--mx) var(--my), rgba(255, 255, 255, .85) 6%, rgba(255, 255, 255, .35) 22%, rgba(0, 0, 0, .38) 92%); }
.r-C .glare, .r-U .glare { opacity: calc(var(--o) * .45); }
.card-face > .shine { z-index: 5; opacity: 0; mix-blend-mode: color-dodge; }
.art-shine { z-index: 2; mix-blend-mode: color-dodge; opacity: calc(.3 + var(--o) * .55); filter: brightness(.62) contrast(1.6) saturate(1.3);
  background-image: repeating-linear-gradient(110deg, #ff6f6f 0%, #ffe45a 6%, #7aff7a 12%, #6af0ff 18%, #7a8aff 24%, #e06aff 30%, #ff6f6f 36%);
  background-size: 400% 400%; background-position: var(--bgx) var(--bgy); }
.r-RR .card-face > .shine { opacity: calc(.1 + var(--o) * .5); filter: brightness(.58) contrast(1.7) saturate(1.2);
  background-image: repeating-linear-gradient(115deg, #ff7773 0%, #ffed5f 7%, #a8ff5f 14%, #83fff7 21%, #7894ff 28%, #d875ff 35%, #ff7773 42%),
    repeating-linear-gradient(60deg, rgba(255, 255, 255, 0) 0 2.2%, rgba(255, 255, 255, .5) 2.8%, rgba(255, 255, 255, 0) 3.4%);
  background-size: 300% 300%, 220% 220%; background-position: var(--bgx) var(--bgy), calc(100% - var(--bgx)) var(--bgy); }
.r-AR .card-face > .shine { opacity: calc(.2 + var(--o) * .5); filter: brightness(.7) contrast(1.4);
  background-image: var(--glitter), linear-gradient(125deg, #ff9ab8 10%, #ffe79a 30%, #9affc8 50%, #9ad8ff 70%, #d99aff 90%);
  background-size: 34%, 300% 300%; background-position: var(--bgx) var(--bgy), var(--bgx) var(--bgy);
  -webkit-mask-image: radial-gradient(farthest-corner circle at var(--mx) var(--my), #000 10%, rgba(0, 0, 0, .35) 70%); mask-image: radial-gradient(farthest-corner circle at var(--mx) var(--my), #000 10%, rgba(0, 0, 0, .35) 70%); }
.r-SR .card-face > .shine { opacity: calc(.35 + var(--o) * .6); filter: brightness(.75) contrast(1.5) saturate(1.4);
  background-image: var(--glitter), var(--glitter), repeating-linear-gradient(125deg, #ff6fa8 0%, #ffe45a 8%, #6affb0 16%, #6ad8ff 24%, #b86aff 32%, #ff6fa8 40%);
  background-size: 26%, 41%, 300% 300%; background-position: var(--bgx) var(--bgy), calc(100% - var(--bgx)) calc(100% - var(--bgy)), var(--bgx) var(--bgy);
  -webkit-mask-image: radial-gradient(farthest-corner circle at var(--mx) var(--my), #000 15%, rgba(0, 0, 0, .45) 75%); mask-image: radial-gradient(farthest-corner circle at var(--mx) var(--my), #000 15%, rgba(0, 0, 0, .45) 75%); }
.r-UR .card-face > .shine { opacity: calc(.4 + var(--o) * .6); filter: brightness(.8) contrast(1.4);
  background-image: var(--glitter), linear-gradient(115deg, transparent 20%, #fff6c8 calc(var(--bgx) - 8%), #ffcf4a var(--bgx), #fff6c8 calc(var(--bgx) + 8%), transparent 80%);
  background-size: 30%, 100% 100%; background-position: var(--bgx) var(--bgy), 0 0; }

/* 小さいカードは軽量化 */
.lite .shine, .lite .glare { display: none; }
.lite .cf-art .aura { display: none; }

/* ---- 小さいカードで文字が重ならないように(幅で情報量を切りかえる) ---- */
.card { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; -webkit-touch-callout: none; }
.card img { -webkit-touch-callout: none; }
.cf > * { min-width: 0; }
.cf-head, .atk-row, .cf-foot, .cf-meta, .cf-sub { overflow: hidden; white-space: nowrap; }
.cf-name, .atk-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cf-atks, .cf-trtext { overflow: hidden; }
.atk-text, .cf-rule, .cf-flavor { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
.cf-flavor { -webkit-line-clamp: 2; }

/* 中くらい(ビューアより小さい):フレーバーを省く */
@container (max-width: 259px) {
  .cf-flavor { display: none; }
  .atk-text { -webkit-line-clamp: 2; }
}
/* 小さい(図鑑・対戦のバトル場など):名前・HP・絵・ワザ名とダメージだけ */
@container (max-width: 175px) {
  .cf-sub, .atk-text, .cf-rule, .cf-foot, .cf-meta, .cf-flavor, .cf-trtext { display: none; }
  .k-mon .cf-stage { display: none; }
  .cf { gap: 2cqw; padding: 2.4cqw 3cqw 3cqw; }
  .cf-head { min-height: 11cqw; gap: 1.4cqw; }
  .cf-name { font-size: 8.6cqw; }
  .cf-hp { font-size: 8.6cqw; }
  .cf-hp small { display: none; }
  .cf-head .ico { width: 8cqw; height: 8cqw; }
  .cf-atks { gap: 4cqw; justify-content: center; }
  .atk-row { gap: 2cqw; }
  .cost { min-width: 0; gap: .6cqw; }
  .cost .ico { width: 7.4cqw; height: 7.4cqw; }
  .atk-name { font-size: 7cqw; }
  .atk-dmg { font-size: 9cqw; }
  .k-trainer .cf-head { flex-direction: column; align-items: flex-start; justify-content: center; gap: 1.4cqw; min-height: 17cqw; }
  .k-trainer .cf-stage { font-size: 5.6cqw; padding: 1.2cqw 2.6cqw; }
  .k-trainer .cf-name { font-size: 8cqw; width: 100%; }
  .k-trainer .cf-art { flex: 1; aspect-ratio: auto; }
  .full .cf-atks { display: none; }
  .full .cf-head { text-shadow: 0 .6cqw 1.6cqw rgba(0, 0, 0, .8), 0 0 .8cqw rgba(0, 0, 0, .7); }
}
/* とても小さい(デッキ編集・手札・ミニ表示):名前・HP・絵だけ */
@container (max-width: 100px) {
  .cf-atks { display: none; }
  .k-mon:not(.full) .cf-art, .k-trainer .cf-art { flex: 1; aspect-ratio: auto; }
  .cf { padding: 3cqw 3.4cqw 3.4cqw; gap: 2.4cqw; }
  .cf-head { min-height: 13cqw; }
  .cf-name { font-size: 11cqw; }
  .cf-hp { font-size: 10.5cqw; }
  .cf-head .ico { display: none; }
  .k-trainer .cf-head { min-height: 22cqw; }
  .k-trainer .cf-stage { font-size: 7.4cqw; }
  .k-trainer .cf-name { font-size: 10cqw; }
}
.pressing > .card, .pressing.card { transform: scale(.95); transition: transform .15s; }

/* ===== バトル選択 ===== */
#scr-bselect .scroll { flex: 1; }
.bs-title { padding: 0 16px 8px; color: var(--mute); font-size: 12px; font-weight: 700; }

/* ===== 対戦 ===== */
#scr-battle { --cwA: 100px; --cwB: 70px; --cwH: 62px; --opp-c: #ff6b3d; --me-c: #3fa8ff;
  background:
    radial-gradient(ellipse 90% 40% at 50% 22%, color-mix(in srgb, var(--opp-c) 30%, transparent), transparent 70%),
    radial-gradient(ellipse 90% 40% at 50% 70%, color-mix(in srgb, var(--me-c) 30%, transparent), transparent 70%); }
.bt { flex: 1; display: flex; flex-direction: column; justify-content: space-between; min-height: 0; padding: 4px 12px 4px; position: relative; }
.bt-mat { position: absolute; left: 12px; right: 12px; top: 50%; height: 1px; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .25), transparent); pointer-events: none; }
.bt-bar { display: flex; align-items: center; gap: 8px; height: 40px; flex: none; }
.bt-bar .who { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.bt-bar .av { width: 34px; height: 34px; border-radius: 50%; background-size: cover; background-position: center; overflow: hidden; position: relative; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .3); flex: none; }
.bt-bar .av img { position: absolute; left: -14%; top: -8%; width: 128%; }
.bt-bar .nm { min-width: 0; }
.bt-bar .nm b { font: 400 14px/1.1 var(--f-disp); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bt-bar .nm small { font-size: 10px; color: var(--mute); font-weight: 700; display: block; white-space: nowrap; }
.pts { display: flex; gap: 5px; flex: none; }
.pts i { width: 18px; height: 18px; border-radius: 50%; background: rgba(255, 255, 255, .07); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .22); position: relative; }
.pts i.on { background: radial-gradient(circle at 35% 30%, #fff, var(--gold) 45%, #c88a10); box-shadow: 0 0 12px rgba(255, 212, 106, .9), inset 0 0 0 1px rgba(255, 255, 255, .6); }
.bt-cnt { display: flex; gap: 10px; align-items: center; font: 800 11px var(--f-body); color: var(--mute); flex: none; }
.bt-cnt span { display: flex; align-items: center; gap: 3px; font-variant-numeric: tabular-nums; }
.bt-cnt svg { width: 13px; height: 13px; }
.ohand { display: flex; height: 26px; align-items: center; }
.ohand .mini { background-image: var(--backimg); background-color: #141a5a; width: 16px; height: 22px; border-radius: 3px; background-size: cover; margin-left: -9px; box-shadow: 0 1px 3px rgba(0, 0, 0, .5); }
.ohand .mini:first-child { margin-left: 0; }

.bt-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; flex: none; position: relative; }
.bt-bench { display: flex; justify-content: center; gap: 10px; height: calc(var(--cwB) * 1.397 + 14px); align-items: center; flex: none; }
.bt-act { height: calc(var(--cwA) * 1.397 + 14px); }
.bt-act > .l { justify-self: start; } .bt-act > .r { justify-self: end; }
.slot { width: var(--sw); aspect-ratio: 63 / 88; border-radius: 9% / 6.5%; position: relative; flex: none; --cw: var(--sw); }
.bt-bench .slot { --sw: var(--cwB); }
.bt-act .slot { --sw: var(--cwA); }
.slot::before { content: ''; position: absolute; inset: 0; border-radius: inherit; border: 2px dashed rgba(255, 255, 255, .13); opacity: 0; transition: .2s; }
.slot.empty::before { opacity: 1; }
.slot.tgt::before { opacity: 1; border-color: var(--cyan); background: rgba(126, 243, 255, .1); animation: tgtPulse 1s ease-in-out infinite; }
@keyframes tgtPulse { 50% { box-shadow: 0 0 18px rgba(126, 243, 255, .6); } }

.bc { -webkit-touch-callout: none; position: relative; width: var(--cw); aspect-ratio: 63 / 88; flex: none; transition: filter .2s; cursor: pointer; touch-action: none; }
.bc > .card { width: 100%; }
.bc.tgt { filter: drop-shadow(0 0 6px var(--cyan)) drop-shadow(0 0 14px var(--cyan)); animation: tgtBob 1s ease-in-out infinite; }
@keyframes tgtBob { 50% { transform: translateY(-3px); } }
.bc.ko .card { filter: grayscale(1) brightness(.6); transition: filter .3s; }
.bc-hp { position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); z-index: 3; min-width: 74%; background: rgba(8, 10, 30, .92); border: 1.5px solid rgba(255, 255, 255, .35); border-radius: 99px; padding: 2px 7px 3px; display: flex; flex-direction: column; align-items: center; gap: 2px; font: 400 12px/1 var(--f-disp); font-variant-numeric: tabular-nums; pointer-events: none; }
.bt-bench .bc-hp { font-size: 10px; padding: 1px 5px 2px; }
.bc-hp .bar { width: 100%; height: 4px; border-radius: 99px; background: rgba(255, 255, 255, .15); overflow: hidden; }
.bc-hp .bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #4dff9a, #b8ff5d); transition: width .7s cubic-bezier(.2, .8, .2, 1), background .3s; }
.bc-hp.mid .bar i { background: linear-gradient(90deg, #ffb52a, #ffe45a); }
.bc-hp.low .bar i { background: linear-gradient(90deg, #ff3a5a, #ff7a5a); }
.bc-en { position: absolute; left: 50%; transform: translateX(-50%); bottom: 10px; display: flex; gap: 1px; z-index: 3; pointer-events: none; }
.bc-en .ico { width: max(12px, calc(var(--cw) * .15)); height: max(12px, calc(var(--cw) * .15)); filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .7)); }
.bc-st { position: absolute; top: -6px; left: -6px; display: flex; flex-direction: column; gap: 2px; z-index: 4; pointer-events: none; }
.bc-st span { font: 800 10px/1 var(--f-body); padding: 3px 6px; border-radius: 99px; box-shadow: 0 2px 6px rgba(0, 0, 0, .5); }
.st-poi { background: #9a3aff; color: #fff; }
.st-par { background: #ffd23a; color: #3a2a00; }

    if (d.dexComplete) out.dexComplete = true;
    out.gifts = {};
    if (obj(d.gifts)) for (const k in d.gifts) if (/^[a-z0-9_-]{1,40}$/i.test(k) && d.gifts[k]) out.gifts[k] = 1;
    if (typeof d.name === 'string') out.name = str(d.name, 10);
    return out;
  },
  /** 取り出したセーブで置きかえて保存する */
  adopt(d) {
    d.moved = Date.now();
    try { localStorage.setItem(this.KEY, JSON.stringify(d)); } catch (e) { }
    return this.load();
  },
};

/* ---------- トースト ---------- */
L.toast = (msg, ms = 1800) => {
  const t = L.$('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(L.toast._t);
  L.toast._t = setTimeout(() => t.classList.remove('show'), ms);
};

/* ---------- ページ内確認ダイアログ(confirm() は使えないため) ---------- */
L.confirmBox = (title, body, okLabel = 'OK', cancelLabel = 'キャンセル') => new Promise(res => {
  const m = L.$('#modal');
  m.innerHTML = '';
  const close = v => { m.hidden = true; m.innerHTML = ''; res(v); };
  const box = L.h('div', { class: 'modal-box', role: 'dialog', 'aria-modal': 'true' },
    L.h('h3', null, title),
    L.h('p', null, body),
    L.h('div', { class: 'modal-actions' },
      cancelLabel ? L.h('button', { class: 'btn ghost', onclick: () => { L.Sound.play('back'); close(false); } }, cancelLabel) : null,
      L.h('button', { class: 'btn primary', onclick: () => { L.Sound.play('select'); close(true); } }, okLabel)));
  m.append(box);
  m.hidden = false;
});

/* ---------- 画面遷移 ---------- */
L.Screens = {
  defs: {}, cur: null, curName: null, busy: false,
  register(name, def) { def.el = L.$('#scr-' + name); this.defs[name] = def; },
  async go(name, params) {
    if (this.busy) return;
    const next = this.defs[name];
    if (!next) return;
    this.busy = true;
    const prev = this.cur;
    try {
      if (prev && prev.exit) await prev.exit();
      if (prev) {
        prev.el.classList.remove('active');
        prev.el.classList.add('leaving');
        setTimeout(() => prev.el.classList.remove('leaving'), 400);
      }
      this.cur = next; this.curName = name;
      document.body.dataset.screen = name;
      next.el.classList.add('active');
      L.$$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.go === name));
      if (next.bgm) L.Music.play(next.bgm);
      if (next.enter) await next.enter(params || {});
    } finally { this.busy = false; }
  },
};

    { id: 'gou', name: 'ゴウ', title: 'よろいの門番', deck: 'rental:stone2', ace: 'yoroigan', type: 'stone', star: 2 },
    { id: 'homura', name: 'ホムラ', title: '紅蓮の双炎', deck: 'rental:m-fire', ace: 'torchion', type: 'fire', star: 3 },
    { id: 'raika', name: 'ライカ', title: '雷雲の王', deck: 'rental:m-spark', ace: 'neonga', type: 'spark', star: 3 },
    { id: 'saku', name: 'サク', title: '満月の双星', deck: 'rental:m-moon', ace: 'kaguyausa', type: 'mystic', star: 3 },
  ];

  L.getDeck = key => {
    if (!key) return null;
    if (key.startsWith('rental:')) return L.RENTALS.find(d => d.key === key) || null;
    if (key.startsWith('my:')) {
      const i = +key.slice(3);
      const d = L.Save.data.decks[i];
      return d ? { key, name: d.name, energy: d.energy, cards: d.cards } : null;
    }
    return null;
  };
  L.validateDeck = cards => {
    const errs = [];
    if (cards.length !== 20) errs.push(`カードは20枚ちょうど必要です(いま${cards.length}枚)`);
    if (!cards.some(id => L.CARDS[id].kind === 'mon' && L.CARDS[id].stage === 0)) errs.push('「きほん」のモンスターが1枚以上必要です');
    const cnt = {};
    cards.forEach(id => { const n = L.CARDS[id].dname; cnt[n] = (cnt[n] || 0) + 1; });
    Object.entries(cnt).forEach(([n, c]) => { if (c > 2) errs.push(`「${n}」は2枚までです`); });
    return errs;
  };
})();

  /* ---------- 背景(属性ごとの風景) ---------- */
  function stars(n, w, h, seed, maxR = 1.6, col = '#fff') {

    `<rect width="${w}" height="${h}" fill="url(#sk)"/><rect y="${h * .5}" width="${w}" height="${h * .5}" fill="url(#sea)"/>` +

    `<g fill="none" stroke="#fff" opacity=".55">${[[.1, .8, .02], [.86, .7, .016], [.92, .9, .012], [.3, .92, .01]].map(([a, b, r]) => `<circle cx="${w * a}" cy="${h * b}" r="${w * r}" stroke-width="1.5"/>`).join('')}</g>`;
  SCENE.spark = (w, h) => lg('sk', [[0, '#1b2160'], [.6, '#4a55b8'], [1, '#8f8ae0']]) + rg('gl', [[0, '#fff6a0', .7], [1, '#fff6a0', 0]], .5, .5, .5) + '|' +
    `<rect width="${w}" height="${h}" fill="url(#sk)"/><ellipse cx="${w * .5}" cy="${h * .55}" rx="${w * .45}" ry="${h * .35}" fill="url(#gl)"/>` +
    `<g fill="#2a2f70" opacity=".9"><ellipse cx="${w * .15}" cy="${h * .12}" rx="${w * .22}" ry="${h * .1}"/><ellipse cx="${w * .45}" cy="${h * .06}" rx="${w * .26}" ry="${h * .1}"/><ellipse cx="${w * .85}" cy="${h * .12}" rx="${w * .24}" ry="${h * .11}"/></g>` +

    `<rect width="${w}" height="${h}" fill="url(#sk)"/><circle cx="${w * .2}" cy="${h * .22}" r="${w * .08}" fill="#fff4d0" opacity=".9"/>` +
    `<path d="M0 ${h * .6} L${w * .1} ${h * .6} L${w * .14} ${h * .38} L${w * .34} ${h * .38} L${w * .38} ${h * .6} L${w * .6} ${h * .6} L${w * .66} ${h * .3} L${w * .86} ${h * .3} L${w * .9} ${h * .6} L${w} ${h * .6} L${w} ${h} L0 ${h}Z" fill="url(#m1)"/>` +
    `<path d="M${w * .14} ${h * .44} L${w * .34} ${h * .44} M${w * .66} ${h * .38} L${w * .86} ${h * .38}" stroke="#ffcf9a" stroke-width="1.5" opacity=".6"/>` +
    `<path d="M0 ${h * .8} C${w * .3} ${h * .74} ${w * .6} ${h * .84} ${w} ${h * .76} L${w} ${h} L0 ${h}Z" fill="url(#m2)"/>`;
  SCENE.any = (w, h) => lg('sk', [[0, '#8ccaff'], [.6, '#d6ecff'], [1, '#fff6e4']]) + '|' +
    `<rect width="${w}" height="${h}" fill="url(#sk)"/>` +
    `<g fill="#fff" opacity=".9"><ellipse cx="${w * .2}" cy="${h * .3}" rx="${w * .16}" ry="${h * .06}"/><ellipse cx="${w * .28}" cy="${h * .26}" rx="${w * .1}" ry="${h * .06}"/><ellipse cx="${w * .76}" cy="${h * .2}" rx="${w * .18}" ry="${h * .06}"/><ellipse cx="${w * .7}" cy="${h * .16}" rx="${w * .09}" ry="${h * .05}"/></g>` +

  function sceneSVG(type, w, h) {

  /* ---------- SR用 特別背景(幾何学的な光) ---------- */
  function specialSVG(type, w, h) {
    const T = L.TYPES[type];
    let rays = '';

      const a = i / 24 * Math.PI * 2, a2 = a + Math.PI / 48;

    }

    for (let i = 1; i < 7; i++) rings += `<circle cx="${w / 2}" cy="${h * .42}" r="${i * w * .12}" fill="none" stroke="#fff" stroke-width="${i % 2 ? 1 : 2}" opacity="${.35 - i * .04}"/>`;

    return svg(w, h, `<rect width="${w}" height="${h}" fill="url(#bg)"/>${rays}${rings}${stars(40, w, h, type.length * 13, 2.2)}`, defs, 'preserveAspectRatio="xMidYMid slice"');
  }

  /* ---------- 属性アイコン ---------- */
  const ICON_PATH = {

    fire: '<path d="M16 5c4 6 9 9 7 16-1 4-4 6-7 6-4 0-7-3-7-7 0-4 3-6 4-10 1 3 2 4 3 5 1-3 1-6 0-10Z" fill="#fff"/><path d="M16 26c-2 0-3.5-1.5-3.5-3.5 0-2 2-3 2.5-5 1 2 4 3 4 5.5 0 1.8-1.4 3-3 3Z" fill="#ff8a45"/>',

  /* ---------- カード裏面(オリジナル紋章) ---------- */
  function backSVG() {
    let rays = '';
    for (let i = 0; i < 16; i++) rays += `<path d="M315 440 L${315 + Math.cos(i / 16 * 6.283) * 600} ${440 + Math.sin(i / 16 * 6.283) * 600} L${315 + Math.cos((i + .5) / 16 * 6.283) * 600} ${440 + Math.sin((i + .5) / 16 * 6.283) * 600}Z" fill="#fff" opacity=".035"/>`;

    <rect x="22" y="22" width="586" height="836" rx="22" fill="none" stroke="url(#gd)" stroke-width="10"/>
    <rect x="40" y="40" width="550" height="800" rx="14" fill="none" stroke="#ffd86a" stroke-opacity=".35" stroke-width="2"/>

  /* ---------- 公開API ---------- */
  const cache = {};

    const c = document.createElement('canvas'); c.width = c.height = 256;

      if (r > .93) { g.save(); g.translate(x, y); g.beginPath(); const s = 2 + Math.random() * 3; g.moveTo(0, -s * 2); g.lineTo(s * .35, 0); g.lineTo(0, s * 2); g.lineTo(-s * .35, 0); g.closePath(); g.moveTo(-s * 2, 0); g.lineTo(0, s * .35); g.lineTo(s * 2, 0); g.lineTo(0, -s * .35); g.fill(); g.restore(); }

/* ルミナリア — カード描画とホロ加工の操作 */
(() => {
  const CV = L.CardView = {};
  const h = L.h;

  const icon = t => h('i', { class: 'ico e-' + t, title: L.TYPES[t] ? L.TYPES[t].name : '' });
  CV.icon = icon;

  function rarityMark(r) {
    const R = L.RARITY[r];
    const span = h('span', { class: 'rar rar-' + r, title: R.label });
    for (let i = 0; i < R.gems; i++) span.append(h('b'));
    return span;
  }
  CV.rarityMark = rarityMark;

  function costRow(cost) { return h('span', { class: 'cost' }, cost.map(icon)); }

  function attackBlock(a) {
    return h('div', { class: 'atk' },
      h('div', { class: 'atk-row' }, costRow(a.cost), h('b', { class: 'atk-name' }, a.name), h('em', { class: 'atk-dmg' }, a.dmgLabel || (a.dmg ? String(a.dmg) : ''))),
      a.text ? h('div', { class: 'atk-text' }, a.text) : null);
  }

  /** カード要素を作る。opts: {w: 幅(px or css), back: 裏向き, noHolo} */
  CV.create = (id, opts = {}) => {
    const c = L.CARDS[id];
    const variant = c.variant || null;
    const full = variant === 'AR' || variant === 'SR' || variant === 'UR';
    const cls = ['card', 'k-' + c.kind, 't-' + c.type, 'r-' + c.rarity];
    if (full) cls.push('full');
    if (c.prime) cls.push('prime');
    if (opts.back) cls.push('flipped');
    const el = h('div', { class: cls.join(' '), dataset: { id } });
    if (opts.w) el.style.setProperty('--cw', typeof opts.w === 'number' ? opts.w + 'px' : opts.w);

    const face = h('div', { class: 'card-face' });
    const frame = h('div', { class: 'cf' });

    if (c.kind === 'mon') {
      const stageLbl = c.stage ? 'しんか1' : 'きほん';
      frame.append(h('div', { class: 'cf-head' },
        h('span', { class: 'cf-stage' }, stageLbl),
        h('span', { class: 'cf-name' }, c.name, c.prime ? h('span', { class: 'prime-mark' }, '✦') : null),
        h('span', { class: 'cf-hp' }, h('small', null, 'HP'), String(c.hp)),
        icon(c.type)));
      let artBg, monSrc = L.Art.monster(c.art);
      if (variant === 'SR' || variant === 'UR') artBg = L.Art.special(c.type);
      else if (variant === 'AR') artBg = L.Art.scene(c.type, true);
      else artBg = L.Art.scene(c.type);
      const art = h('div', { class: 'cf-art' });
      art.style.backgroundImage = `url("${artBg}")`;
      if (c.prime && !full) art.append(h('div', { class: 'aura' }));
      art.append(h('img', { class: 'mon', src: monSrc, alt: c.name, draggable: 'false' }));
      if (c.rarity === 'R') art.append(h('div', { class: 'shine art-shine' }));
      frame.append(art);
      if (!full) frame.append(h('div', { class: 'cf-sub' }, c.stage ? `${c.from}から進化` : '', h('span', null, c.cat)));
      const atks = h('div', { class: 'cf-atks' }, c.attacks.map(attackBlock));
      frame.append(atks);
      if (c.prime) frame.append(h('div', { class: 'cf-rule' }, h('b', null, '✦ルール'), 'このモンスターがきぜつしたとき、相手は2ポイント獲得する。'));
      frame.append(h('div', { class: 'cf-foot' },
        h('span', null, '弱点 ', icon(c.weak), '+20'),
        h('span', null, 'にげる ', Array.from({ length: c.retreat }, () => icon('any')))));
      if (!full && c.flavor) frame.append(h('div', { class: 'cf-flavor' }, c.flavor));
    } else {
      frame.append(h('div', { class: 'cf-head tr' },
        h('span', { class: 'cf-stage tr-' + c.sub }, c.sub === 'item' ? 'グッズ' : 'サポート'),
        h('span', { class: 'cf-name' }, c.name)));
      const art = h('div', { class: 'cf-art' });
      art.style.backgroundImage = `url("${L.Art.scene('trainer')}")`;
      art.append(h('img', { class: 'mon', src: L.Art.item(c.art), alt: c.name, draggable: 'false' }));
      frame.append(art);
      frame.append(h('div', { class: 'cf-trtext' }, c.text));
      frame.append(h('div', { class: 'cf-rule tr' }, c.sub === 'item' ? 'グッズは、自分の番に何枚でも使える。' : 'サポートは、自分の番に1枚しか使えない。'));
    }
    frame.append(h('div', { class: 'cf-meta' }, h('span', null, 'LMN ' + c.no + '/' + String(L.TOTAL).padStart(3, '0')), rarityMark(c.rarity)));
    face.append(frame);
    if (!opts.noHolo) face.append(h('div', { class: 'shine' }), h('div', { class: 'glare' }));
    const rot = h('div', { class: 'card-rot' }, face, h('div', { class: 'card-back' }));
    el.append(rot);
    return el;
  };

  CV.back = (w) => {

  /* ---------- 傾き・光沢 ---------- */
  CV.setTilt = (el, px, py, strength = 1) => {

    s.setProperty('--my', (py * 100).toFixed(1) + '%');
    s.setProperty('--bgx', (30 + px * 40).toFixed(1) + '%');
    s.setProperty('--bgy', (30 + py * 40).toFixed(1) + '%');
    const hyp = Math.min(1, Math.hypot(px - .5, py - .5) * 2);
    s.setProperty('--hyp', hyp.toFixed(3));
    s.setProperty('--o', Math.min(1, .35 + hyp * .9 * strength).toFixed(3));
  };

  /** 指やマウスで傾ける+放置中はゆっくり揺れる。戻り値で解除 */
  CV.interactive = (el, opts = {}) => {
    let active = false, raf = 0, t0 = performance.now(), tx = .5, ty = .5, cx = .5, cy = .5, gyro = null;
    const target = opts.target || el;
    const onMove = e => {
      const r = el.getBoundingClientRect();

      ty = L.clamp((e.clientY - r.top) / r.height, 0, 1);
      active = true; lastInput = performance.now();

    let lastInput = 0;
    const onLeave = () => { active = false; };
    const onOrient = e => {
      if (e.beta == null || e.gamma == null) return;

    target.addEventListener('pointerdown', onMove);
    target.addEventListener('pointerleave', onLeave);
    target.addEventListener('pointerup', onLeave);
    window.addEventListener('deviceorientation', onOrient);

    raf = requestAnimationFrame(loop);
    return () => {
      cancelAnimationFrame(raf);
      target.removeEventListener('pointermove', onMove);
      target.removeEventListener('pointerdown', onMove);
      target.removeEventListener('pointerleave', onLeave);
      target.removeEventListener('pointerup', onLeave);
      window.removeEventListener('deviceorientation', onOrient);
      el.classList.remove('live');
    };
  };

  /** iOSのジャイロ許可(ユーザー操作中に呼ぶ) */
  CV.askGyro = async () => {
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        await DeviceOrientationEvent.requestPermission();
      }
    } catch (e) { }
  };

  /* 属性アイコンのCSSを注入 */
  CV.injectCSS = () => {
    const st = document.createElement('style');
    let css = L.TYPE_ORDER.map(t => `.e-${t}{background-image:url("${L.Art.icon(t)}")}`).join('\n');
    css += `\n:root{--backimg:url("${L.Art.back()}")}\n.card-back{background-image:var(--backimg)}`;
    css += `\n:root{--glitter:url("${L.Art.glitter()}")}`;
    st.textContent = css;
    document.head.append(st);
  };
})();

/* ルミナリア — パーティクル演出(Canvas) */
(() => {
  const FX = L.FX = {};
  let cv, g, W = 0, H = 0, dpr = 1, parts = [], ents = [], running = false, last = 0;
  const sprites = new Map();

  FX.init = () => {
    cv = L.$('#fx'); g = cv.getContext('2d');
    FX.resize(); window.addEventListener('resize', FX.resize);

  FX.resize = () => {
    const r = cv.getBoundingClientRect();

    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);

  const org = () => cv.getBoundingClientRect();

  function glowSprite(color) {
    if (sprites.has(color)) return sprites.get(color);
    const s = document.createElement('canvas'); s.width = s.height = 64;
    const c = s.getContext('2d');
    const gr = c.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,255,1)');
    gr.addColorStop(.18, color);
    gr.addColorStop(.5, color.replace(/rgb\(([^)]+)\)/, 'rgba($1,.35)').replace(/^#(\w{6})$/, (m, hx) => { const n = parseInt(hx, 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},.35)`; }));
    gr.addColorStop(1, 'rgba(0,0,0,0)');

  }

  function add(p) {
    if (L.reduced && parts.length > 60) return;
    p.age = 0; p.life = p.life || 1; p.vx = p.vx || 0; p.vy = p.vy || 0; p.g = p.g || 0; p.drag = p.drag ?? .985;
    p.size = p.size || 6; p.size2 = p.size2 ?? p.size * .2; p.a = p.a ?? 1; p.rot = p.rot || 0; p.vr = p.vr || 0;
    parts.push(p); start();
  }
  function start() { if (!running) { running = true; last = performance.now(); requestAnimationFrame(loop); } }

  function loop(now) {
    const dt = L.clamp((now - last) / 1000, 0, .05); last = Math.max(last, now);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, H);
    // エンティティ(光線・リング・稲妻)
    for (let i = ents.length - 1; i >= 0; i--) {
      const e = ents[i]; e.age += dt;
      if (e.age >= e.life) { ents.splice(i, 1); continue; }
      e.draw(g, e.age / e.life, dt);
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.age += dt;
      if (p.age >= p.life) { parts.splice(i, 1); continue; }
      const t = p.age / p.life;
      p.vx *= p.drag; p.vy *= p.drag; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.wobble) p.x += Math.sin((p.age + p.seed) * p.wobble) * .6;

      const a = p.a * (p.fadeIn ? Math.min(1, t * 6) : 1) * (1 - Math.pow(t, p.fadePow || 1.6));
      if (a <= 0 || sz <= 0) continue;
      g.globalAlpha = a;
      g.globalCompositeOperation = p.blend || 'lighter';
      switch (p.shape) {
        case 'star': drawStar(p.x, p.y, sz, p.rot, p.color); break;
        case 'ring': g.strokeStyle = p.color; g.lineWidth = p.lw || 2; g.beginPath(); g.arc(p.x, p.y, sz, 0, 6.283); g.stroke(); break;
        case 'shard': g.fillStyle = p.color; g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.beginPath(); g.moveTo(0, -sz); g.lineTo(sz * .5, sz * .6); g.lineTo(-sz * .5, sz * .4); g.closePath(); g.fill(); g.restore(); break;
        case 'leaf': g.fillStyle = p.color; g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.beginPath(); g.ellipse(0, 0, sz, sz * .45, 0, 0, 6.283); g.fill(); g.strokeStyle = 'rgba(20,70,20,.5)'; g.lineWidth = 1; g.beginPath(); g.moveTo(-sz, 0); g.lineTo(sz, 0); g.stroke(); g.restore(); break;
        case 'bubble': g.strokeStyle = p.color; g.lineWidth = 1.6; g.beginPath(); g.arc(p.x, p.y, sz, 0, 6.283); g.stroke(); g.fillStyle = 'rgba(255,255,255,.7)'; g.beginPath(); g.arc(p.x - sz * .35, p.y - sz * .35, sz * .25, 0, 6.283); g.fill(); break;
        case 'streak': { const sp = Math.hypot(p.vx, p.vy) || 1; const l = sz * 3; g.strokeStyle = p.color; g.lineWidth = p.lw || 2; g.lineCap = 'round'; g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x - p.vx / sp * l, p.y - p.vy / sp * l); g.stroke(); break; }

      const sp = (o.speed || 300) * (.35 + Math.random() * .75);
      add({ x: x + (Math.random() - .5) * (o.jitter || 0), y: y + (Math.random() - .5) * (o.jitter || 0), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        g: o.g ?? 0, drag: o.drag ?? .95, life: (o.life || .8) * (.6 + Math.random() * .6), size: (o.size || 6) * (.6 + Math.random() * .8), size2: o.size2,

        wobble: o.wobble, seed: Math.random() * 10, fadeIn: o.fadeIn, flip: 6 + Math.random() * 8 });

  };

  FX.ring = (sx, sy, o = {}) => {
    const { x, y } = FX.local(sx, sy);

    ents.push({ age: 0, life: o.life || .6, draw(g, t) {

    const rot0 = Math.random() * 6.28;
    ents.push({ age: 0, life: o.life || 1.4, draw(g, t) {

  FX.bolt = (sx1, sy1, sx2, sy2, o = {}) => {
