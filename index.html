    const mk = () => { let pts = [a, b]; for (let k = 0; k < 5; k++) { const np = []; for (let i = 0; i < pts.length - 1; i++) { const p = pts[i], q = pts[i + 1]; const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2; const len = Math.hypot(q.x - p.x, q.y - p.y); const nx = -(q.y - p.y) / (len || 1), ny = (q.x - p.x) / (len || 1); const off = (Math.random() - .5) * len * .35; np.push(p, { x: mx + nx * off, y: my + ny * off }); } np.push(pts[pts.length - 1]); pts = np; } return pts; };
    let path = mk(), tick = 0;
    ents.push({ age: 0, life: o.life || .45, draw(g, t, dt) {
      tick += dt; if (tick > .05) { tick = 0; path = mk(); }
      g.globalCompositeOperation = 'lighter';
      const draw = (w, c, al) => { g.globalAlpha = al * (1 - t * .6); g.strokeStyle = c; g.lineWidth = w; g.lineJoin = 'round'; g.lineCap = 'round'; g.beginPath(); path.forEach((p, i) => i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y)); g.stroke(); };
      draw(14, o.color || '#ffe45a', .25); draw(6, o.color || '#ffe45a', .6); draw(2.2, '#ffffff', 1);

  const TCOL = {
    leaf: ['#b8ff8a', '#5fd35a', '#e6ffb0'], fire: ['#ffe46a', '#ff8a2a', '#ff4a2a'], water: ['#bff0ff', '#4aabff', '#ffffff'],
    spark: ['#fff6a0', '#ffd23a', '#ffffff'], mystic: ['#f0c8ff', '#b07cff', '#ff9ae0'], stone: ['#e8c49a', '#b8804a', '#fff0d0'], any: ['#ffffff', '#e8f4ff', '#fff6d0'],

      else if (type === 'water') add({ x: tx, y: ty, vx: (Math.random() - .5) * 60, vy: (Math.random() - .5) * 60, life: .5, size: 4 + Math.random() * 4, size2: 2, color: '#e8fbff', shape: 'bubble', blend: 'source-over' });
      else if (type === 'leaf') add({ x: tx, y: ty, vx: (Math.random() - .5) * 80, vy: (Math.random() - .5) * 80, life: .6, size: 7, size2: 5, color: L.pick(['#8fe06a', '#5fc44b', '#c8ff8a']), shape: 'leaf', vr: 10, blend: 'source-over' });
      else if (type === 'mystic') add({ x: tx, y: ty, life: .5, size: 7, size2: 0, color: L.pick(cols), shape: 'star', vr: 4 });
      else if (type === 'stone') add({ x: tx, y: ty, vx: (Math.random() - .5) * 60, vy: 40, g: 300, life: .5, size: 5, size2: 3, color: L.pick(cols), shape: 'shard', vr: 8, blend: 'source-over' });
      else add({ x: tx, y: ty, life: .35, size: 10, size2: 1, color: L.pick(cols) });

  /** 着弾エフェクト */

      this.emit({ t: 'endTurn', pi: this.cur });
      // どく
      this.P.forEach((p, pi) => this.inPlay(p).forEach(c => { if (c.st.poi) { c.dmg += 10; this.emit({ t: 'poisonTick', pi, uid: c.uid, amount: 10 }); } }));
      // マヒは持ち主の番が終わると回復
      this.inPlay(this.P[this.cur]).forEach(c => { if (c.st.par) { delete c.st.par; this.emit({ t: 'statusClear', pi: this.cur, uid: c.uid, st: 'par' }); } });
      this.checkKO();
      if (this.winner !== null) return;
      if (this.pending.length) { this.phase = 'promote'; this.after = 'next'; this.emit({ t: 'needPromote', players: this.pending.slice() }); return; }
      this.nextTurn();
    }
    nextTurn() {
      this.cur = 1 - this.cur; this.turn++;
      if (this.turn > TURN_LIMIT) { this.winner = 'draw'; this.phase = 'over'; this.emit({ t: 'win', winner: 'draw', reason: 'limit' }); return; }
      this.phase = 'main';
      this.startTurn();
    }
    checkKO() {
      const kos = [];
      this.P.forEach((p, pi) => this.inPlay(p).forEach(c => { if (c.dmg >= c.def.hp) kos.push([pi, c]); }));
      if (!kos.length) return;
      kos.forEach(([pi, c]) => {
        const p = this.P[pi], o = this.opp(pi);
        if (p.active === c) p.active = null; else p.bench.splice(p.bench.indexOf(c), 1);
        p.discard.push(c, ...c.under);
        const pts = c.def.prime ? 2 : 1;
        o.points += pts;
        this.emit({ t: 'ko', pi, uid: c.uid, pts, scorer: 1 - pi });
      });
      // 勝敗
      const win = [false, false];
      this.P.forEach((p, pi) => { if (p.points >= 3) win[pi] = true; });
      this.P.forEach((p, pi) => { if (!p.active && !p.bench.length) win[1 - pi] = true; });
      if (win[0] || win[1]) {
        this.winner = win[0] && win[1] ? 'draw' : (win[0] ? 0 : 1);
        this.phase = 'over';
        const reason = this.P.some(p => p.points >= 3) ? 'points' : 'wipe';
        this.emit({ t: 'win', winner: this.winner, reason });
        return;
      }
      this.P.forEach((p, pi) => { if (!p.active && !this.pending.includes(pi)) this.pending.push(pi); });
    }
    promote(pi, uid) {
      if (this.phase !== 'promote' || !this.pending.includes(pi)) return this.flush();
      const p = this.P[pi], bi = p.bench.findIndex(c => c.uid === uid);
      if (bi < 0) return this.flush();
      p.active = p.bench.splice(bi, 1)[0];
      this.pending.splice(this.pending.indexOf(pi), 1);
      this.emit({ t: 'promote', pi, uid });
      if (!this.pending.length) { this.phase = 'main'; if (this.after === 'next') { this.after = null; this.nextTurn(); } }
      return this.flush();
    }
  }
  L.Game = Game;
})();

/* ルミナリア — CPUの思考 */
(() => {
  const AI = L.AI = {};

  function expDmg(g, att, atk, def, bonus = 0) {
    const fx = atk.fx || {};
    let d = atk.dmg || 0;
    if (fx.coins) d = fx.per * fx.coins * .5;
    if (fx.coinBonus) d += fx.coinBonus * .5;
    if (fx.coinsExtra) d += fx.per * fx.coinsExtra * .5;
    if (fx.bonusIfDamaged && def.dmg > 0) d += fx.bonusIfDamaged;
    if (fx.bonusIfSelfDamaged && att.dmg > 0) d += fx.bonusIfSelfDamaged;
    if (d > 0) { d += bonus; if (def.def.weak === att.def.type) d += 20; }
    return d;
  }
  function minDmg(g, att, atk, def, bonus = 0) {
    const fx = atk.fx || {};
    let d = fx.coins ? 0 : (atk.dmg || 0);
    if (fx.bonusIfDamaged && def.dmg > 0) d += fx.bonusIfDamaged;
    if (fx.bonusIfSelfDamaged && att.dmg > 0) d += fx.bonusIfSelfDamaged;
    if (d > 0) { d += bonus; if (def.def.weak === att.def.type) d += 20; }
    return d;
  }
  function withEnergy(c, type) { return { def: c.def, dmg: c.dmg, en: type ? [...c.en, type] : c.en, st: c.st }; }
  function bestAttack(g, pi, att, def, bonus = 0) {
    let best = null;
    att.def.attacks.forEach((atk, idx) => {
      if (!g.energyOK(att, atk.cost)) return;
      const e = expDmg(g, att, atk, def, bonus), m = minDmg(g, att, atk, def, bonus);
      const ko = m >= def.def.hp - def.dmg;
      const score = (ko ? 1000 : 0) + e + (atk.fx && atk.fx.paraCoin ? 8 : 0) + (atk.fx && atk.fx.poison && !def.st.poi ? 12 : 0) + (atk.fx && atk.fx.callFamily ? 15 : 0);
      if (!best || score > best.score) best = { idx, score, e, ko };
    });
    return best;
  }
  function need(g, c) {
    // 最大ワザまでに足りないエネルギー数
    const atks = c.def.attacks;
    const top = atks[atks.length - 1];
    return Math.max(0, top.cost.length - c.en.length);
  }

  /** CPUの1ターン。step(events) で演出を待つ */
  AI.takeTurn = async (g, pi, step, choose) => {
    const p = g.P[pi], o = g.P[1 - pi];
    const guard = { n: 0 };
    const alive = () => g.isMain(pi) && ++guard.n < 40;

    // 1. よびこみの笛(きほんが手札になくベンチに空き)
    for (const c of p.hand.slice()) {
      if (!alive()) return;
      if (c.def.art === 'whistle' && p.bench.length < 3 && !p.hand.some(x => x.def.kind === 'mon' && x.def.stage === 0) && g.canUseTrainer(pi, c.uid)) await step(g.useTrainer(pi, c.uid));
    }
    // 2. きほんをベンチへ
    for (const c of p.hand.slice()) { if (!alive()) return; if (g.canPlayBasic(pi, c.uid)) await step(g.playBasic(pi, c.uid)); }
    // 3. 進化(✦優先、バトル場優先)
    const evos = p.hand.filter(c => c.def.kind === 'mon' && c.def.stage === 1).sort((a, b) => (b.def.prime ? 1 : 0) - (a.def.prime ? 1 : 0));
    for (const c of evos) {
      if (!alive()) return;
      const ts = g.evoTargets(pi, c.uid);
      if (!ts.length) continue;
      const t = ts.includes(p.active && p.active.uid) ? p.active.uid : ts[0];
      await step(g.evolve(pi, c.uid, t));
    }
    // 4. 研究員のメモ(手札が少ない時)/ 応援団長(きぜつ圏内なら)/ 旋風の使い
    const attachType = p.energy.cur;
    const actNow = () => p.active ? withEnergy(p.active, !p.f.energyUsed && attachType && need(g, p.active) > 0 ? attachType : null) : null;
    if (alive() && !p.f.supporter && o.active && p.active) {
      const whirl = p.hand.find(c => c.def.art === 'whirl');
      const cheer = p.hand.find(c => c.def.art === 'cheer');
      const memo = p.hand.find(c => c.def.art === 'memo');
      const a = actNow();
      let used = false;
      if (whirl && o.bench.length && g.canUseTrainer(pi, whirl.uid)) {
        // ベンチにきぜつさせられる相手(✦なら特に)がいれば引きずり出す
        let tgt = null, tscore = 0;
        o.bench.forEach(b => {
          const ba = bestAttack(g, pi, a, b);
          if (!ba) return;
          const s = (ba.ko ? 100 + (b.def.prime ? 60 : 0) : 0) + (b.def.prime && b.dmg > 0 ? 10 : 0);
          if (s > tscore) { tscore = s; tgt = b; }
        });
        const cur = bestAttack(g, pi, a, o.active);
        if (tgt && tscore >= 100 && !(cur && cur.ko && o.active.def.prime)) { await step(g.useTrainer(pi, whirl.uid, tgt.uid)); used = true; }
      }
      if (!used && cheer && g.canUseTrainer(pi, cheer.uid)) {
        const b0 = bestAttack(g, pi, a, o.active), b1 = bestAttack(g, pi, a, o.active, 10);
        if (b1 && b1.ko && !(b0 && b0.ko)) { await step(g.useTrainer(pi, cheer.uid)); used = true; }
      }
      if (!used && memo && p.hand.length <= 4 && g.canUseTrainer(pi, memo.uid)) { await step(g.useTrainer(pi, memo.uid)); used = true; }
    }
    // 5. いやしの葉
    for (const c of p.hand.slice()) {
      if (!alive()) return;
      if (c.def.art === 'leaf' && p.active && p.active.dmg >= 20 && g.canUseTrainer(pi, c.uid)) await step(g.useTrainer(pi, c.uid));
    }
    // 6. エネルギー
    if (alive() && p.energy.cur && !p.f.energyUsed) {
      let target = p.active;
      if (!p.active || need(g, p.active) === 0) {
        const cands = p.bench.filter(b => need(g, b) > 0).sort((x, y) => (y.def.prime ? 2 : 0) + (y.def.stage) - ((x.def.prime ? 2 : 0) + x.def.stage) || need(g, x) - need(g, y));
        const evoable = p.bench.filter(b => p.hand.some(h => h.def.from === b.def.name && h.def.stage === 1));
        target = evoable[0] || cands[0] || p.active;
      }
      if (target) await step(g.attach(pi, target.uid));
    }
    // 7. にげる
    if (alive() && p.active && o.active) {
      const cur = bestAttack(g, pi, p.active, o.active);
      const doomed = p.active.def.prime && o.active && o.active.def.attacks.some(at => minDmg(g, o.active, at, p.active) >= p.active.def.hp - p.active.dmg) && p.bench.length;
      if (!cur || doomed) {
        const boots = p.hand.find(c => c.def.art === 'boots');
        const cand = p.bench.map(b => ({ b, ba: bestAttack(g, pi, b, o.active) })).filter(x => x.ba).sort((x, y) => y.ba.score - x.ba.score)[0];
        const cost = g.retreatCost(pi);
        if (cand && (cost <= p.active.en.length)) {
          if (boots && cost > 0 && g.canUseTrainer(pi, boots.uid) && cost - 1 <= p.active.en.length) await step(g.useTrainer(pi, boots.uid));
          if (g.canRetreat(pi)) await step(g.retreat(pi, cand.b.uid));
        } else if (doomed && g.canRetreat(pi) && p.bench.length) {
          const safe = p.bench.slice().sort((x, y) => (x.def.prime ? 1 : 0) - (y.def.prime ? 1 : 0) || (y.def.hp - y.dmg) - (x.def.hp - x.dmg))[0];
          await step(g.retreat(pi, safe.uid));
        }
      }
    }
    // 8. ワザ
    if (alive() && p.active && o.active) {
      const ba = bestAttack(g, pi, p.active, o.active, p.f.dmgBonus || 0);
      if (ba && g.canAttack(pi, ba.idx)) { await step(g.attack(pi, ba.idx)); return; }
    }
    if (g.isMain(pi)) await step(g.endTurn(pi));
  };

  /** バトル場に出すモンスターを選ぶ */
  AI.choosePromote = (g, pi) => {
    const p = g.P[pi], o = g.P[1 - pi];
    const scored = p.bench.map(b => {
      const ba = o.active ? bestAttack(g, pi, b, o.active) : null;
      return { b, s: (ba ? 100 + ba.e : 0) + (b.def.hp - b.dmg) * .3 - (b.def.prime ? 15 : 0) };
    }).sort((x, y) => y.s - x.s);
    return scored[0].b.uid;
  };
  /** 最初の配置 */
  AI.chooseSetup = (g, pi) => {
    const p = g.P[pi];
    const basics = p.hand.filter(c => c.def.kind === 'mon' && c.def.stage === 0);
    // バトル場: ワザが軽く、HPが高いもの。ハネモフ(仲間呼び)は序盤に強い
    const sc = c => c.def.hp + (c.def.attacks[0].cost.length === 1 ? 20 : 0) + (c.def.attacks[0].fx && c.def.attacks[0].fx.callFamily ? 15 : 0);
    basics.sort((a, b) => sc(b) - sc(a));
    return { active: basics[0].uid, bench: basics.slice(1, 4).map(c => c.uid) };
  };
})();

/* ルミナリア — オンライン対戦の通信(Firebase Realtime Database の REST + ストリーミング) */
(() => {
  // 公開版では config.js で差し込む。空ならオンライン対戦は「準備中」表示になる
  L.CONFIG = Object.assign({ db: '' }, window.LUMINARIA_CONFIG || {});
  const N = L.Net = {};
  const ALPH = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // 見まちがえやすい 0/O・1/I は使わない
  N.CODE_RE = /^[A-HJ-NP-Z2-9]{5}$/;

  N.db = () => (L.CONFIG.db || '').replace(/\/+$/, '');
  N.available = () => !!N.db();
  N.genCode = () => Array.from({ length: 5 }, () => ALPH[Math.floor(Math.random() * ALPH.length)]).join('');

  /** 決まった種から同じ乱数列を作る(両方の端末で同じ結果を再現するため) */
  N.rng = seed => {
    let a = seed >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  /** 盤面の要約値(食い違いの検知用) */
  N.hash = obj => {
    const s = JSON.stringify(obj);
    let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return h.toString(36);
  };

  const url = path => `${N.db()}/${path}.json`;
  async function req(method, path, body) {
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), 10000);
    try {
      const r = await fetch(url(path), { method, body: body === undefined ? undefined : JSON.stringify(body), signal: ctl.signal, headers: body === undefined ? undefined : { 'Content-Type': 'application/json' } });
      if (!r.ok) throw Object.assign(new Error('http ' + r.status), { status: r.status });
      return await r.json();
    } finally { clearTimeout(to); }
  }
  N.req = req;
  const TS = { '.sv': 'timestamp' };

  /** 部屋(ルーム)。role は 'host' か 'guest' */
  class Room {
    constructor(code, role) {
      this.code = code; this.role = role; this.data = {}; this.seen = new Set();
      this.handlers = { update: [], action: [], peer: [], error: [] };
      this.lastPeerAlive = null; this.lastPeerSeenAt = Date.now(); this.closed = false; this.sendN = 0; this.buffer = [];
    }
    on(ev, fn) { this.handlers[ev].push(fn); return this; }
    emit(ev, ...a) { this.handlers[ev].forEach(f => { try { f(...a); } catch (e) { console.error(e); } }); }
    get other() { return this.role === 'host' ? 'guest' : 'host'; }

    /** 変更をリアルタイムに受け取る */
    listen() {
      return new Promise((resolve, reject) => {
        let opened = false;
        const es = this.es = new EventSource(url(`rooms/${this.code}`));
        const apply = (type, payload) => {
          let msg; try { msg = JSON.parse(payload); } catch (e) { return; }
          if (!msg || typeof msg.path !== 'string') return;
          const parts = msg.path.split('/').filter(Boolean);
          if (!parts.length) { this.data = type === 'patch' ? Object.assign({}, this.data, msg.data) : (msg.data || {}); }
          else {
            let o = this.data;
            for (let i = 0; i < parts.length - 1; i++) { if (typeof o[parts[i]] !== 'object' || o[parts[i]] === null) o[parts[i]] = {}; o = o[parts[i]]; }
            const k = parts[parts.length - 1];
            if (type === 'patch') o[k] = Object.assign({}, o[k] || {}, msg.data);
            else if (msg.data === null) delete o[k]; else o[k] = msg.data;
          }
          if (!opened) { opened = true; resolve(); }
          this.process();
        };
        es.addEventListener('put', e => apply('put', e.data));
        es.addEventListener('patch', e => apply('patch', e.data));
        es.addEventListener('cancel', () => this.emit('error', 'cancel'));
        es.onerror = () => { if (!opened) { es.close(); reject(new Error('stream')); } else this.emit('error', 'stream'); };
        setTimeout(() => { if (!opened) { es.close(); reject(new Error('timeout')); } }, 12000);
      });
    }
    process() {
      const d = this.data || {};
      this.emit('update', d);
      // 相手の生存確認
      const pa = d.alive && d.alive[this.other];
      if (pa && pa !== this.lastPeerAlive) { this.lastPeerAlive = pa; this.lastPeerSeenAt = Date.now(); this.emit('peer', true); }
      // 相手の操作(送られた順=キー順に1回ずつ)
      const log = d.log || {};
      Object.keys(log).sort().forEach(k => {
        if (this.seen.has(k)) return;
        this.seen.add(k);
        const e = log[k];
        if (!e || e.by === this.role) return;
        let a; try { a = JSON.parse(e.a); } catch (er) { return; }
        if (this.handlers.action.length) this.emit('action', a, e); else this.buffer.push([a, e]);
      });
    }
    /** 相手の操作の受け取り先を決める(それまでに届いた分もまとめて渡す) */
    setActionHandler(fn) { this.handlers.action = [fn]; this.buffer.splice(0).forEach(([a, e]) => fn(a, e)); }
    async send(action, h) {
      const n = ++this.sendN;
      const r = await req('POST', `rooms/${this.code}/log`, { by: this.role, n, a: JSON.stringify(action), h: h || '' });
      if (r && r.name) this.seen.add(r.name);
      return r;
    }
    startHeartbeat() {
      const beat = () => { if (!this.closed) req('PUT', `rooms/${this.code}/alive/${this.role}`, TS).catch(() => this.emit('error', 'beat')); };
      beat(); this.hb = setInterval(beat, 5000);
      this.watch = setInterval(() => { if (Date.now() - this.lastPeerSeenAt > 25000) this.emit('peer', false); }, 3000);
    }
    close() {
      this.closed = true;
      clearInterval(this.hb); clearInterval(this.watch);
      if (this.es) this.es.close();
    }
  }
  N.Room = Room;

  /** 部屋を作る */
  N.create = async me => {
    let code = null;
    for (let i = 0; i < 5; i++) { const c = N.genCode(); const cur = await req('GET', `rooms/${c}`); if (cur === null) { code = c; break; } }
    if (!code) throw new Error('code');
    const seed = Math.floor(Math.random() * 2 ** 31);
    await req('PUT', `rooms/${code}`, { v: 1, t: TS, seed, host: me });
    const room = new Room(code, 'host');
    await room.listen();
    room.startHeartbeat();
    return room;
  };
  /** 部屋に入る。失敗理由は error.reason に入る */
  N.join = async (code, me) => {
    const cur = await req('GET', `rooms/${code}`);
    if (!cur || !cur.host) throw Object.assign(new Error('none'), { reason: 'none' });
    if (cur.guest) throw Object.assign(new Error('full'), { reason: 'full' });
    if (cur.t && Date.now() - cur.t > 6 * 3600 * 1000) throw Object.assign(new Error('old'), { reason: 'old' });
    await req('PUT', `rooms/${code}/guest`, me);
    const room = new Room(code, 'guest');
    await room.listen();
    room.startHeartbeat();
    return room;
  };
})();

/* ルミナリア — ダイヤ(パックを引く通貨)とボーナス */
(() => {
  const h = L.h;
  const E = L.Eco = {};

  /* ダイヤのアイコン(オリジナル) */
  const GEM_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaffff"/><stop offset=".45" stop-color="#6ae8ff"/><stop offset="1" stop-color="#2a6ad8"/></linearGradient><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9af0ff"/></linearGradient></defs><path d="M9 5h14l6 8-13 15L3 13z" fill="url(#a)" stroke="#1a3a8a" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 13h26M9 5l4 8 3-8 3 8 4-8M13 13l3 15 3-15" fill="none" stroke="#1a3a8a" stroke-width="1" stroke-linejoin="round" opacity=".55"/><path d="M9 5h14l-4 8h-6z" fill="url(#b)" opacity=".7"/><path d="M10.5 7.5l2 3" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>`;
  E.icon = () => h('i', { class: 'gem-ico', 'aria-hidden': 'true' });
  E.injectCSS = () => {
    const st = document.createElement('style');
    st.textContent = `.gem-ico{background-image:url("${L.Art.url(GEM_SVG)}")}`;
    document.head.append(st);
  };

  E.get = () => L.Save.data.diamonds | 0;
  E.can = n => E.get() >= n;
  E.spend = n => { if (!E.can(n)) return false; L.Save.data.diamonds -= n; L.Save.save(); E.refresh(); return true; };
  E.add = (n, opts = {}) => {
    if (!n) return;
    L.Save.data.diamonds = E.get() + n;
    L.Save.save();
    E.refresh(opts.from);
  };

  /* 画面上のダイヤ表示(複数あってもまとめて更新) */
  E.chip = () => {
    const b = h('button', { class: 'gem-chip', 'aria-label': 'ダイヤ', onclick: () => { L.Sound.play('tap'); E.help(); } }, E.icon(), h('b', null, String(E.get())));
    b._shown = E.get();
    return b;
  };
  E.refresh = from => {
    const now = E.get();
    L.$$('.gem-chip').forEach(chip => {
      const b = chip.querySelector('b');
      const start = chip._shown ?? now;
      chip._shown = now;
      if (start === now) { b.textContent = now; return; }
      const t0 = performance.now(), dur = 700;
      const step = t => { const k = Math.min(1, (t - t0) / dur); b.textContent = Math.round(start + (now - start) * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
      if (now > start) {
        L.anim(chip, [{ transform: 'scale(1)' }, { transform: 'scale(1.18)' }, { transform: 'scale(1)' }], { duration: 420, easing: 'cubic-bezier(.3,1.5,.5,1)' });
        const c = L.center(chip);
        if (from) E.fly(from, c, Math.min(10, 3 + Math.round((now - start) / 20)));
        else L.FX.sparkle(c.x, c.y, { n: 10, speed: 140, colors: ['#bff6ff', '#ffffff'] });
      }
    });
  };
  /** 画面のある地点からダイヤ表示までダイヤが飛ぶ演出 */

        row('毎日のログインボーナス', `+${X.loginDaily}`),
        row('7日連続ログイン(7日ごと)', `+${X.loginWeekBonus}`),

        row('バトルに負けても', `+${X.lose}`),
        row('新しいカードを手に入れる', `+${X.newCard} / 枚`),
        row(`図鑑が${X.milestoneEvery}種類ふえるごと`, `+${X.milestone}`),
        row('図鑑コンプリート', `+${X.complete}`)),

    m.hidden = false;
  };

  /* ---------- ログインボーナス ---------- */
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
  const yesterday = () => { const d = new Date(Date.now() - 864e5); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
  /** その日の初回なら受け取り内容を返す(まだ加算はしない) */
  E.checkLogin = () => {
    const lg = L.Save.data.login;
    if (lg.last === today()) return null;
    const streak = lg.last === yesterday() ? lg.streak + 1 : 1;
    const bonus = streak % 7 === 0 ? L.ECON.loginWeekBonus : 0;
    return { streak, amount: L.ECON.loginDaily + bonus, bonus };
  };
  E.showLogin = () => new Promise(res => {
    const info = E.checkLogin();
    if (!info) return res(false);

    const m = L.$('#modal'); m.innerHTML = '';
    const days = h('div', { class: 'login-days' });

      days,
      h('div', { class: 'login-amount' }, E.icon(), `+${info.amount}`),
      info.bonus ? h('p', { class: 'login-note' }, `7日連続ボーナス +${info.bonus} を含みます`) : null,

    btn.addEventListener('click', () => {
      const from = L.center(box.querySelector('.login-amount'));

      res(true);

    const c = L.center(box);
    L.FX.sparkle(c.x, c.y - 60, { n: 18, speed: 240, colors: ['#bff6ff', '#fff', '#ffe6a0'] });
  });

  /* ---------- プレゼント(1人1回だけ受け取れる配布) ---------- */
  E.pendingGifts = () => (L.ECON.gifts || []).filter(g => !L.Save.data.gifts[g.id]);
  /** 未受け取りのプレゼントを順に見せる。全部受け取ったら終わる */
  E.showGifts = async () => {
    for (const g of E.pendingGifts()) await E.showGift(g);
  };
  E.showGift = g => new Promise(res => {
    const m = L.$('#modal'); m.innerHTML = '';

    const btn = h('button', { class: 'btn big shimmer', id: 'btn-gift-get' }, '受け取る');

      if (L.Save.data.gifts[g.id]) return;

      E.add(g.amount, { from });
      res(true);

    m.append(box); m.hidden = false;
    L.Sound.play('revealRR');
    const c = L.center(box.querySelector('.gift-gem'));
    L.FX.rays(c.x, c.y, { colors: ['rgba(160,240,255,.7)', 'rgba(255,255,255,.5)'], life: 1.4, a: .5 });
    L.FX.sparkle(c.x, c.y, { n: 26, speed: 300, colors: ['#bff6ff', '#fff', '#ffe6a0'] });
  });

  /* ---------- 図鑑ボーナス(パック開封後に呼ぶ) ---------- */
  E.dexBonus = newCount => {
    const X = L.ECON, D = L.Save.data;
    const owned = L.CARD_LIST.filter(c => L.Save.own(c.id)).length;
    let amount = newCount * X.newCard;
    const lines = [];
    if (newCount) lines.push(`新しいカード ${newCount}枚 +${newCount * X.newCard}`);
    const ms = Math.floor(owned / X.milestoneEvery);
    if (ms > (D.dexMs || 0)) {
      const k = ms - (D.dexMs || 0);
      amount += k * X.milestone;
      lines.push(`図鑑 ${ms * X.milestoneEvery}種類達成 +${k * X.milestone}`);
      D.dexMs = ms;
    }
    if (owned >= L.TOTAL && !D.dexComplete) { amount += X.complete; lines.push(`図鑑コンプリート! +${X.complete}`); D.dexComplete = true; }
    return { amount, lines };

  /* ---------- バトル報酬 ---------- */
  E.battleReward = (opp, win) => win ? L.ECON.win[opp.star || 1] : L.ECON.lose;
})();

/* ルミナリア — 起動・背景・タイトル・ホーム・設定 */
(() => {

        raf = requestAnimationFrame(loop);

        lastDraw = now;
        const t = (now - t0) / 1000;
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#070b24'); bg.addColorStop(1, '#04061a');
        g.fillStyle = bg; g.fillRect(0, 0, W, H);
        g.globalCompositeOperation = 'lighter';
        BG.tint.forEach((c, i) => {
          const x = W * (.5 + Math.sin(t * .07 + i * 2.1) * .42), y = H * (.35 + Math.cos(t * .05 + i * 1.7) * .3), r = Math.max(W, H) * (.45 + i * .06);
          const gr = g.createRadialGradient(x, y, 0, x, y, r);
          gr.addColorStop(0, c + '44'); gr.addColorStop(1, c + '00');

          g.beginPath(); g.arc(m.x * W + Math.sin(t * .5 + m.p) * 8, m.y * H, m.r, 0, 6.283); g.fill();
        });
        g.globalCompositeOperation = 'source-over';
      };
      const start = () => { cancelAnimationFrame(raf); if (!document.hidden) raf = requestAnimationFrame(loop); };

/* ルミナリア — パック選択と開封演出 */
(() => {

    /* ---------- 開封 ---------- */
    async open(pk) {

    tear(stage, wrap, packEl, glow, tier) {

        };
        const down = e => {
          if (done || auto) return;
          const R = r();
          if (e.clientY < R.top - 60 || e.clientY > R.bottom) return;

/* ルミナリア — 図鑑とカードビューア */
(() => {
  const h = L.h;

  /* ---------- ビューア(拡大・傾けてホロを見る) ---------- */
  const V = L.Viewer = {};
  V.open = (ids, index = 0, opts = {}) => {
    const box = L.$('#viewer'); box.innerHTML = ''; box.hidden = false;
    let i = index, stop = null;
    const holder = h('div', { class: 'vw-card' });
    const info = h('div', { class: 'vw-info' });
    const prev = h('button', { class: 'icon-btn', 'aria-label': '前のカード', html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5 8 12l7 7"/></svg>' });
    const next = h('button', { class: 'icon-btn', 'aria-label': '次のカード', html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m9 5 7 7-7 7"/></svg>' });
    const close = () => { stop && stop(); box.hidden = true; box.innerHTML = ''; L.Sound.play('back'); document.removeEventListener('keydown', key); opts.onClose && opts.onClose(); };
    const show = (dir = 0) => {
      stop && stop();
      const id = ids[i], c = L.CARDS[id];
      holder.innerHTML = '';
      const el = L.CardView.create(id);
      holder.append(el);
      stop = L.CardView.interactive(el, { target: holder });
      const R = L.RARITY[c.rarity];
      const own = L.Save.own(id);
      const pk = L.PACKS.find(p => p.id === c.pack);
      info.innerHTML = '';
      info.append(h('b', null, c.dname), h('small', null, `${R.label} ・ No.${c.no} ・ ${pk ? pk.name : '全パック共通'}`), h('small', null, own ? `所持 ${own}枚` : 'まだ持っていません'), opts.extra ? h('small', { style: { color: 'var(--cyan)' } }, opts.extra(id)) : null);
      prev.disabled = ids.length < 2; next.disabled = ids.length < 2;
      if (dir) L.anim(el, [{ transform: `translateX(${dir * 40}px)`, opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 260, easing: 'ease-out' });
      else L.anim(el, [{ transform: 'scale(.8) rotateY(-30deg)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 420, easing: 'cubic-bezier(.3,1.3,.5,1)' });
      const o = R.order;
      if (o >= 3) { L.Sound.play(o >= 4 ? 'revealRR' : 'revealR'); } else L.Sound.play('flip');
    };
    const go = d => { if (ids.length < 2) return; i = (i + d + ids.length) % ids.length; show(d); };
    prev.addEventListener('click', () => go(-1)); next.addEventListener('click', () => go(1));
    const key = e => { if (e.key === 'Escape') close(); if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1); };
    document.addEventListener('keydown', key);
    // 横スワイプで前後(ゆっくりなぞると傾き)
    let sx = 0, st = 0;
    holder.addEventListener('pointerdown', e => { sx = e.clientX; st = performance.now(); });
    holder.addEventListener('pointerup', e => { const dx = e.clientX - sx; if (Math.abs(dx) > 70 && performance.now() - st < 350) go(dx < 0 ? 1 : -1); });
    // 背景の上で押して離したときだけ閉じる(開いた直後の自動クリックで閉じないように)
    let bgDown = false;
    box.addEventListener('pointerdown', e => { bgDown = e.target === box; });
    box.addEventListener('click', e => { if (e.target === box && bgDown) close(); bgDown = false; });
    box.append(
      h('button', { class: 'icon-btn vw-close', 'aria-label': '閉じる', onclick: close, html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>' }),
      holder, info, h('div', { class: 'vw-nav' }, prev, h('small', { style: { color: 'var(--mute)', fontWeight: 700, fontSize: '11px' } }, '指でなぞると光が動きます'), next));
    L.CardView.askGyro();
    show(0);
  };

  /* ---------- 図鑑 ---------- */
  L.Screens.register('dex', {
    bgm: 'home',
    filter: 'all',
    enter() {
      L.BG.setTint(['#2a58d0', '#7a4bd0', '#2fb8ff']);
      this.render();
    },
    render() {
      const el = this.el; el.innerHTML = '';
      const owned = L.CARD_LIST.filter(c => L.Save.own(c.id));
      const pct = owned.length / L.TOTAL * 100;
      const packProg = L.PACKS.map(pk => {
        const pool = L.CARD_LIST.filter(c => c.pack === pk.id || c.pack === 'all');
        const got = pool.filter(c => L.Save.own(c.id)).length;
        return h('div', null, h('span', null, `${pk.name} ${got}/${pool.length}`), h('div', { class: 'progress' }, h('i', { style: { width: (got / pool.length * 100) + '%' } })));
      });
      const F = [['all', 'すべて'], ['own', '所持のみ'], ['rare', 'レア'], ...['leaf', 'fire', 'water', 'spark', 'mystic', 'stone', 'any'].map(t => [t, L.TYPES[t].name]), ['trainer', 'トレーナーズ']];
      const chips = h('div', { class: 'chips', role: 'tablist' }, F.map(([k, lbl]) => {
        const b = h('button', { class: 'chip' + (this.filter === k ? ' on' : ''), role: 'tab', 'aria-selected': this.filter === k ? 'true' : 'false', onclick: () => { L.Sound.play('tap'); this.filter = k; this.render(); } });
        if (L.TYPES[k]) b.append(L.CardView.icon(k));
        b.append(lbl);
        return b;
      }));
      const list = L.DEX.filter(c => {
        const f = this.filter;
        if (f === 'all') return true;
        if (f === 'own') return L.Save.own(c.id) > 0;
        if (f === 'rare') return L.RARITY[c.rarity].order >= 3;
        if (f === 'trainer') return c.kind === 'trainer';
        return c.kind === 'mon' && c.type === f;
      });
      const grid = h('div', { class: 'dex-grid' });
      const ownedIds = list.filter(c => L.Save.own(c.id)).map(c => c.id);
      list.forEach(c => {
        const n = L.Save.own(c.id);
        if (n) {
          const card = L.CardView.create(c.id);
          card.classList.add('lite');
          const it = h('div', { class: 'dex-item', role: 'button', tabindex: '0', 'aria-label': `${c.dname} ${n}枚` }, card, n > 1 ? h('span', { class: 'cnt' }, '×' + n) : null);
          if (!L.Save.data.seen[c.id]) it.append(h('span', { class: 'newdot', title: '新しく手に入れたカード' }));
          const open = () => { L.Sound.play('tap'); L.Save.data.seen[c.id] = 1; L.Save.save(); const d = it.querySelector('.newdot'); d && d.remove(); L.Viewer.open(ownedIds, ownedIds.indexOf(c.id)); };
          it.addEventListener('click', open);
          it.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
          grid.append(it);
        } else {
          const art = c.kind === 'mon' ? L.Art.monster(c.art) : L.Art.item(c.art);
          grid.append(h('div', { class: 'dex-item locked', 'aria-label': `No.${c.no} 未入手` }, h('div', { class: 'locked-card' }, h('img', { src: art, alt: '', draggable: 'false' }), h('span', null, 'No.' + c.no))));
        }
      });
      el.append(
        h('div', { class: 'topbar' }, h('h2', null, 'カード図鑑'), L.ui.gear()),
        h('div', { class: 'dex-head' },
          h('div', { class: 'dex-count' }, h('b', null, `${owned.length} / ${L.TOTAL}`), h('span', null, `コンプリート率 ${pct.toFixed(0)}%`)),
          h('div', { class: 'progress' }, h('i', { style: { width: pct + '%' } })),
          h('div', { class: 'pack-prog' }, packProg)),
        chips,
        h('div', { class: 'scroll', style: { flex: 1 } }, grid, owned.length ? null : h('p', { class: 'hint', style: { padding: '0 16px 20px' } }, 'パックを開けるとカードが図鑑に登録されます。')));
    },
  });
})();

/* ルミナリア — デッキ一覧と編集 */
(() => {
  const h = L.h;
  const aceOf = cards => {
    const mons = cards.map(id => L.CARDS[id]).filter(c => c.kind === 'mon');
    mons.sort((a, b) => (b.prime ? 1 : 0) - (a.prime ? 1 : 0) || b.hp - a.hp);
    return mons[0] || null;
  };
  L.deckAce = aceOf;

  /** デッキの中身をビューアで見る(同じカードは1枚にまとめ、枚数を添える) */
  const viewDeck = cards => {
    const cnt = {}; cards.forEach(id => { cnt[id] = (cnt[id] || 0) + 1; });
    const ids = Object.keys(cnt).sort();
    if (!ids.length) return;
    L.Sound.play('select');
    L.Viewer.open(ids, 0, { extra: id => `このデッキに ${cnt[id]}枚` });
  };
  L.viewDeck = viewDeck;
  function deckRow(d, sel, onPick, onEdit) {
    const ace = aceOf(d.cards);
    const art = h('div', { class: 'dr-art' });
    if (ace) { art.style.backgroundImage = `url("${L.Art.scene(ace.type)}")`; art.append(h('img', { src: L.Art.monster(ace.art), alt: '' })); }
    const stopBubble = e => e.stopPropagation();
    const row = h('div', { class: 'deck-row' + (sel ? ' sel' : ''), role: 'button', tabindex: '0', 'aria-label': `${d.name}(長押しで中身を見る)` },
      art,
      h('div', { class: 'dr-main' }, h('b', null, d.name), h('small', null, 'エネルギー ', d.energy.map(L.CardView.icon), ` ・ ${d.cards.length}枚`)),
      sel ? h('span', { class: 'tag' }, '使用中') : null,
      h('button', { class: 'btn ghost sm dr-edit', onpointerdown: stopBubble, onpointerup: stopBubble, onclick: e => { e.stopPropagation(); viewDeck(d.cards); } }, '中身'),
      onEdit ? h('button', { class: 'btn ghost sm dr-edit', onpointerdown: stopBubble, onpointerup: stopBubble, onclick: e => { e.stopPropagation(); onEdit(); } }, '編集') : null);
    return L.ui.press(row, { tap: onPick, long: () => viewDeck(d.cards) });
  }

  L.Screens.register('deck', {
    bgm: 'home',
    enter() { L.BG.setTint(['#2a48c0', '#2fb8a0', '#6a4bd0']); this.render(); },
    render() {
      const el = this.el; el.innerHTML = '';
      const D = L.Save.data;
      const pick = key => () => { L.Sound.play('select'); D.deckSel = key; L.Save.save(); this.render(); L.toast('バトルで使うデッキを変えました'); };
      const my = D.decks.map((d, i) => {

          h('div', { class: 'dr-art', style: { display: 'grid', placeItems: 'center', fontSize: '26px', color: 'var(--mute)' } }, '+'),
          h('div', { class: 'dr-main' }, h('b', null, `マイデッキ ${i + 1}`), h('small', null, '持っているカードで20枚のデッキを作る')));
        const valid = !L.validateDeck(d.cards).length;
        return deckRow({ name: d.name + (valid ? '' : '(未完成)'), energy: d.energy, cards: d.cards }, D.deckSel === key,
          valid ? pick(key) : () => { L.Sound.play('error'); L.toast('20枚そろうと使えます'); }, () => { L.Sound.play('select'); L.Screens.go('deckedit', { slot: i }); });
      });
      el.append(
        h('div', { class: 'topbar' }, h('h2', null, 'デッキ'), L.ui.gear()),
        h('div', { class: 'scroll', style: { flex: 1 } },
          h('div', { class: 'deck-list' },
            h('p', { class: 'hint', style: { textAlign: 'left', margin: '0' } }, 'デッキを長押しすると中身のカードを見られます'),
            h('p', { class: 'deck-sec' }, 'マイデッキ'), my,
            h('p', { class: 'deck-sec' }, 'レンタルデッキ(いつでも使える)'),

  L.Screens.register('deckedit', {
    bgm: 'home',
    enter(params) {

      this.filter = 'all';

    },
    counts() { const n = {}; this.draft.cards.forEach(id => { n[id] = (n[id] || 0) + 1; }); return n; },
    byName(dname) { return this.draft.cards.filter(id => L.CARDS[id].dname === dname).length; },
    render() {

      const energyChips = h('div', { class: 'de-energy' }, 'エネルギー',
        ['leaf', 'fire', 'water', 'spark', 'mystic', 'stone'].map(t => h('button', { class: 'chip' + (dr.energy.includes(t) ? ' on' : ''), 'aria-pressed': dr.energy.includes(t) ? 'true' : 'false', onclick: () => {
          L.Sound.play('tap');

          this.render();

      const uniq = [...new Set(sorted)];
      sorted.forEach(id => {
        const c = L.CardView.create(id, { w: 64 }); c.classList.add('lite');
        const el = h('div', { class: 'slotc', role: 'button', tabindex: '0', 'aria-label': L.CARDS[id].dname + '(タップで外す・長押しで拡大)' }, c, h('span', { class: 'x' }, '×'));
        deckStrip.append(L.ui.press(el, {
          tap: () => { L.Sound.play('back'); dr.cards.splice(dr.cards.indexOf(id), 1); this.render(); },
          long: () => { L.Sound.play('select'); L.Viewer.open(uniq, uniq.indexOf(id), { extra: x => `デッキに ${dr.cards.filter(y => y === x).length}枚` }); },
        }));
      });
      const owned = L.DEX.filter(c => L.Save.own(c.id) && (this.filter === 'all' || (this.filter === 'trainer' ? c.kind === 'trainer' : c.type === this.filter)));
      const cnt = this.counts();
      const pool = h('div', { class: 'de-pool' });
      owned.forEach(c => {
        const inDeck = cnt[c.id] || 0, own = L.Save.own(c.id);
        const full = inDeck >= own || this.byName(c.dname) >= 2 || dr.cards.length >= 20;

        pool.append(L.ui.press(el, {

            if (this.byName(c.dname) >= 2) { L.Sound.play('error'); L.toast(`「${c.dname}」は2枚までです`); return; }
            if (inDeck >= own) { L.Sound.play('error'); L.toast('持っている枚数を超えています'); return; }
            L.Sound.play('place'); dr.cards.push(c.id);
            if (c.kind === 'mon' && c.type !== 'any' && !dr.energy.length) dr.energy = [c.type];
            this.render();
          },
          long: () => { L.Sound.play('select'); const ids = owned.map(x => x.id); L.Viewer.open(ids, ids.indexOf(c.id), { extra: x => `デッキに ${dr.cards.filter(y => y === x).length}枚 / 所持 ${L.Save.own(x)}枚` }); },
        }));

      B.net.handlers.error = [];
    } else {
      ME = 0; CPU = 1;
      const opp = B.opp = L.OPPONENTS.find(o => o.id === params.opp) || L.OPPONENTS[1];
      let my = L.getDeck(params.deck);
      if (!my || L.validateDeck(my.cards).length) my = L.RENTALS[1];
      B.myDeck = my; B.oppDeck = L.getDeck(opp.deck);
      g = B.g = new L.Game({ names: ['あなた', opp.name], energy: [my.energy, B.oppDeck.energy], decks: [my.cards, B.oppDeck.cards] });
    }
    const opp = B.opp;
    if (B.net) B.net.setActionHandler(B.onRemote);
    B.els = new Map(); B.mode = null; B.busy = true; B.hideOpp = true;
    B.build(); B.size();
    B.onResize = () => B.size(); window.addEventListener('resize', B.onResize);
    L.BG.setTint([L.TYPES[B.oppDeck.energy[0]] ? L.TYPES[B.oppDeck.energy[0]].c2 : '#ff6b3d', '#3a4bd0', L.TYPES[B.myDeck.energy[0]] ? L.TYPES[B.myDeck.energy[0]].c2 : '#2fd8ff']);
    B.sync(g.snapshot(), { anim: false });
    B.msg('コインを投げて先攻を決めます');
    await L.sleep(500); if (!B.alive) return;
    // オンラインは共通の乱数で決める(両方の画面で同じ結果になる)
    const heads = on ? g.r() < .5 : Math.random() < .5;
    const first = on ? (heads ? 0 : 1) : (heads ? ME : CPU);
    await B.coins([heads], on ? 'オモテなら部屋を作った人が先攻' : 'オモテならあなたが先攻'); if (!B.alive) return;
    g.decideFirst(first);
    await B.banner(first === ME ? 'あなたが先攻' : `${opp.name}が先攻`, first === ME ? 'me' : 'opp'); if (!B.alive) return;
    await B.play(g.dealOpening()); if (!B.alive) return;
    if (on) {
      const mine = await B.humanSetup(); if (!B.alive) return;
      B.sendNet({ t: 'setup', active: mine.active, bench: mine.bench });
      B.busy = true; B.msg('相手の準備を待っています…');
      const theirs = await new Promise(res => { if (B.remoteSetupData) res(B.remoteSetupData); else B.remoteSetupRes = res; });
      if (!B.alive) return;
      try { g.setupPlace(ME, mine.active, mine.bench); g.setupPlace(CPU, theirs.active, theirs.bench || []); }
      catch (e) { B.desync('setup'); return; }
    } else {
      const s = L.AI.chooseSetup(g, CPU); g.setupPlace(CPU, s.active, s.bench);
      B.sync(g.snapshot(), { anim: false });
      B.slots[CPU].bench.concat(B.slots[CPU].act).forEach(sl => { const e = sl.querySelector('.bc'); if (e) L.anim(e, [{ transform: 'translateY(-40px) scale(.8)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 320 }); });
      L.Sound.play('place');
      const mine = await B.humanSetup(); if (!B.alive) return;
      g.setupPlace(ME, mine.active, mine.bench);
    }
    B.sync(g.snapshot());
    await B.serial(() => B.play(g.begin()));
    B.begun = true;
    B.early.splice(0).forEach(x => B.onRemote(...x));
    B.next();
  };

  /* ---------- 準備フェーズ ---------- */
  B.humanSetup = () => new Promise(res => {
    B.setupSel = { active: null, bench: [], res };
    B.mode = { kind: 'setup' }; B.busy = false;
    B.renderSetup();
  });
  B.setupSnap = () => {
    const s = JSON.parse(JSON.stringify(B.g.snapshot()));
    const ss = B.setupSel, P = s.P[ME];
    const take = uid => { const i = P.hand.findIndex(c => c.uid === uid); const c = P.hand.splice(i, 1)[0]; return { uid: c.uid, id: c.id, dmg: 0, en: [], st: {} }; };
    P.active = ss.active ? take(ss.active) : null;
    P.bench = ss.bench.map(take);
    return s;
  };
  B.renderSetup = () => {
    B.sync(B.setupSnap());
    const ss = B.setupSel;
    B.handEl.querySelectorAll('.bc').forEach(el => { const c = L.CARDS[el.dataset.id]; el.classList.toggle('can', c.kind === 'mon' && c.stage === 0 && (!ss.active || ss.bench.length < 3)); });
    const ok = h('button', { class: 'btn', id: 'btn-ready', disabled: !ss.active, onclick: () => {
      if (!ss.active) return;
      L.Sound.play('select'); B.mode = null; B.busy = true; B.msg('');
      B.handEl.querySelectorAll('.bc').forEach(el => el.classList.remove('can'));
      ss.res({ active: ss.active, bench: ss.bench.slice() });
    } }, '準備OK');
    B.msg(ss.active ? 'ベンチにも置けます(最大3匹)。置いたカードをタップで戻す' : '「きほん」のモンスターをタップしてバトル場に出そう', [ok]);
    B.endBtn.disabled = true;
  };
  B.setupTap = el => {
    const ss = B.setupSel, bc = el.closest('.bc');
    if (!bc) return;
    const uid = +bc.dataset.uid, c = L.CARDS[bc.dataset.id];
    if (bc.parentNode === B.handEl) {
      if (c.kind !== 'mon' || c.stage !== 0) { L.Sound.play('error'); B.float('「きほん」のモンスターだけ出せます', L.center(bc).x, L.center(bc).y - 60, 'info', 1400, -10); return; }
      if (!ss.active) ss.active = uid; else if (ss.bench.length < 3) ss.bench.push(uid); else { L.Sound.play('error'); return; }
      L.Sound.play('place');
    } else if (bc.closest('.slot') && bc.closest('.slot').dataset.p == ME) {
      if (ss.active === uid) { ss.active = ss.bench.shift() || null; } else ss.bench = ss.bench.filter(x => x !== uid);
      L.Sound.play('back');
    } else return;
    B.renderSetup();
    const e2 = B.els.get(uid); if (e2 && e2.closest('.slot')) { const c2 = L.center(e2); L.FX.burst(c2.x, c2.y + c2.h * .4, { n: 10, colors: ['#ffffff'], speed: 140, size: 10, size2: 20, life: .5, shape: 'smoke', a: .25, blend: 'source-over' }); }
  };

  /* ================= 進行 ================= */
  B.next = async () => {
    if (B.inNext) return;
    B.inNext = true;
    const g = B.g;
    try {
      while (B.alive) {
        if (g.winner !== null) { B.result(); return; }
        if (g.phase === 'promote') {
          if (g.pending.includes(ME)) { await B.humanPromote(); continue; }
          if (g.pending.includes(CPU)) {
            if (B.net) { B.waitRemote('相手がバトル場に出すモンスターを選んでいます…'); return; }
            await L.sleep(400); await B.play(g.promote(CPU, L.AI.choosePromote(g, CPU))); continue;
          }
        }
        if (g.cur === CPU) {
          if (B.net) { B.waitRemote(`${B.opp.name}のターンです。相手の操作を待っています…`); return; }
          B.busy = true; B.endBtn.disabled = true;
          B.msg(`${B.opp.name}が考えています…`);
          await L.sleep(600);
          await L.AI.takeTurn(g, CPU, async evs => { if (!B.alive) return; await B.play(evs); await L.sleep(380); });
          continue;
        }
        B.busy = false; B.setMode(null);
        return;
      }
    } finally { B.inNext = false; }
  };
  /** 演出を1本の列にならべる(自分の操作と相手の操作が重ならないように) */
  B.serial = fn => (B.chain = B.chain.then(() => (B.alive ? fn() : null)).catch(e => console.error(e)));
  B.act = evs => {
    if (!evs.length) { L.Sound.play('error'); return; }
    B.busy = true; B.setMode(null, true); B.endBtn.disabled = true;
    return B.serial(() => B.play(evs)).then(() => { if (B.alive) B.next(); });
  };
  B.humanPromote = () => new Promise(res => {
    B.busy = false;
    B.mode = { kind: 'promote', res };
    B.highlight();
    B.msg('バトル場に出すモンスターをベンチから選んでください');
    L.Sound.play('select');
  });

  /* ---------- 操作の実行(オンラインなら相手にも送る) ---------- */
  B.applyA = (pi, a) => {
    const g = B.g;
    switch (a && a.t) {
      case 'basic': return g.playBasic(pi, a.uid);
      case 'evolve': return g.evolve(pi, a.uid, a.target);
      case 'trainer': return g.useTrainer(pi, a.uid, a.target);
      case 'attach': return g.attach(pi, a.uid);
      case 'retreat': return g.retreat(pi, a.uid);
      case 'attack': return g.attack(pi, a.idx);
      case 'end': return g.endTurn(pi);
      case 'promote': return g.promote(pi, a.uid);
    }
    return [];
  };
  B.do = a => {
    const evs = B.applyA(ME, a);
    if (!evs.length) { L.Sound.play('error'); return; }
    B.sendNet(a);
    return B.act(evs);
  };
  B.sendNet = (a, tries = 0) => {
    if (!B.net) return;
    const room = B.net, hsh = L.Net.hash(B.g.snapshot());
    room.send(a, hsh).catch(() => {
      if (tries < 3 && B.net === room) setTimeout(() => { if (B.net === room) room.send(a, hsh).catch(() => B.netTrouble()); }, 800 * (tries + 1));
      else B.netTrouble();
    });
  };
  B.waitRemote = msg => { B.busy = true; B.endBtn.disabled = true; B.setMode(null, true); B.msg(msg); };
  /** 相手の操作を受け取った */
  B.onRemote = (a, e) => {
    if (!B.alive || !B.net) return;
    if (a.t === 'setup') { B.remoteSetupData = a; if (B.remoteSetupRes) { const r = B.remoteSetupRes; B.remoteSetupRes = null; r(a); } return; }
    if (!B.begun) { B.early.push([a, e]); return; }
    if (a.t === 'resign') {
      B.serial(async () => { if (B.g.winner !== null) return; B.g.winner = ME; B.g.phase = 'over'; B.oppResigned = true; }).then(() => B.result());
      return;
    }
    B.serial(async () => {
      const evs = B.applyA(CPU, a);
      if (!evs.length) { B.desync('invalid'); return; }
      if (e && e.h && L.Net.hash(B.g.snapshot()) !== e.h) { B.desync('hash'); return; }
      await B.play(evs);
    }).then(() => { if (B.alive) B.next(); });
  };
  B.onPeer = ok => {
    if (!B.alive || !B.root) return;
    const cur = B.root.querySelector('.net-warn');
    if (ok) { if (cur) cur.remove(); return; }
    if (cur || B.g.winner !== null) return;
    B.root.append(h('div', { class: 'net-warn', role: 'status' },
      h('b', null, '相手との接続が切れたようです'),
      h('span', null, 'もどってくるまで待つか、ロビーに戻れます。'),
      h('button', { class: 'btn ghost sm', onclick: () => { L.Sound.play('back'); L.Screens.go('online'); } }, 'ロビーへ')));
  };
  B.netTrouble = () => L.toast('通信に失敗しました。電波の良い場所で試してください', 3000);
  B.desync = why => {
    if (!B.alive || B.desynced) return;
    B.desynced = true; B.busy = true;
    console.warn('desync', why);
    L.confirmBox('通信のずれが起きました', 'お互いの画面の内容が食い違ったため、この対戦を終了します。ロビーから新しい部屋を作り直してください。', 'ロビーへ', null).then(() => L.Screens.go('online'));
  };

  /* ---------- モードとハイライト ---------- */
  B.setMode = (m, quiet) => {
    B.mode = m;
    if (B.tip) B.tip.hidden = true;
    B.handEl.querySelectorAll('.bc').forEach(el => el.classList.remove('sel'));
    B.orbs[ME].cur.classList.remove('sel');
    B.highlight();
    if (quiet) return;
    const g = B.g;
    if (!m && g.isMain(ME)) {
      const P = g.P[ME];
      const hints = [];
      if (P.energy.cur && !P.f.energyUsed) hints.push('エネルギーをモンスターへ');
      if (P.active && P.active.def.attacks.some((a, i) => g.canAttack(ME, i))) hints.push('バトル場のモンスターをタップでワザ');
      B.msg(`あなたのターン(${g.turn})` + (hints.length ? ' — ' + hints[0] : ''));
    }
    B.endBtn.disabled = !(g.isMain(ME) && !B.busy);
  };
  B.highlight = () => {
    const g = B.g, m = B.mode;
    B.root.querySelectorAll('.tgt').forEach(e => e.classList.remove('tgt'));
    B.handEl.querySelectorAll('.bc').forEach(el => el.classList.remove('can'));
    B.orbs[ME].cur.classList.remove('ready');
    if (!m && g.isMain(ME) && !B.busy) {
      const P = g.P[ME];
      B.handEl.querySelectorAll('.bc').forEach(el => {
        const uid = +el.dataset.uid, c = L.CARDS[el.dataset.id];
        const can = c.kind === 'trainer' ? g.canUseTrainer(ME, uid) : c.stage === 0 ? g.canPlayBasic(ME, uid) : g.evoTargets(ME, uid).length > 0;
        el.classList.toggle('can', can);
      });
      if (P.energy.cur && !P.f.energyUsed) B.orbs[ME].cur.classList.add('ready');
      return;
    }
    if (!m) return;
    const mark = uid => { const el = B.els.get(uid); el && el.classList.add('tgt'); };
    if (m.kind === 'hand') {
      const c = L.CARDS[m.id];
      if (c.kind === 'mon' && c.stage === 0) B.slots[ME].bench.forEach(s => { if (s.classList.contains('empty')) s.classList.add('tgt'); });
      else if (c.kind === 'mon') g.evoTargets(ME, m.uid).forEach(mark);
      else if (c.art === 'whirl') g.P[CPU].bench.forEach(b => mark(b.uid));
    } else if (m.kind === 'energy') g.inPlay(g.P[ME]).forEach(c => mark(c.uid));
    else if (m.kind === 'retreat' || m.kind === 'promote') g.P[ME].bench.forEach(c => mark(c.uid));
  };

  /* ---------- 入力(タップとドラッグ) ---------- */
  B.down = e => {
    if (!B.alive) return;
    const t = e.target;
    if (t.closest('button') && !t.closest('.bc')) return;
    B.drag = { x: e.clientX, y: e.clientY, t, started: false, ghost: null, src: null, lp: 0, long: false };
    const anyBc = t.closest('.bc');
    if (anyBc) B.drag.lp = setTimeout(() => { const d = B.drag; if (!d || d.started) return; d.long = true; L.vibrate(12); B.inspect(anyBc); }, 450);
    const hand = t.closest('.bt-hand .bc'), orb = t.closest('.ezone.me .orb.cur');
    if (!B.busy && B.mode?.kind !== 'setup' && B.g.isMain(ME)) {
      if (hand) B.drag.src = { kind: 'hand', el: hand };
      else if (orb && B.g.P[ME].energy.cur && !B.g.P[ME].f.energyUsed) B.drag.src = { kind: 'energy', el: orb };
    }
    document.addEventListener('pointermove', B.dragMove); document.addEventListener('pointerup', B.dragUp);
  };
  B.dragMove = e => {
    const d = B.drag; if (!d) return;
    if (d.lp && Math.hypot(e.clientX - d.x, e.clientY - d.y) > 10) { clearTimeout(d.lp); d.lp = 0; }
    if (!d.src || d.long) return;
    if (!d.started && Math.hypot(e.clientX - d.x, e.clientY - d.y) > 12) {
      d.started = true;
      if (d.src.kind === 'hand') B.selectHand(d.src.el, true); else B.selectEnergy(true);
      const gh = d.src.kind === 'hand' ? d.src.el.querySelector('.card').cloneNode(true) : h('div', { class: d.src.el.className.replace('ready', '') });
      gh.classList.add('ghost-drag');
      if (d.src.kind === 'hand') gh.style.setProperty('--cw', (B.cwH * 1.15) + 'px');
      B.fx.append(gh); d.ghost = gh;
      d.src.el.style.opacity = d.src.kind === 'hand' ? .35 : .4;
    }
    if (d.started) {
      const p = relPos(e.clientX, e.clientY);
      d.ghost.style.left = p.x + 'px'; d.ghost.style.top = p.y + 'px';
    }
  };
  B.dragUp = e => {
    document.removeEventListener('pointermove', B.dragMove); document.removeEventListener('pointerup', B.dragUp);
    const d = B.drag; B.drag = null;
    if (!d) return;
    clearTimeout(d.lp);
    if (d.long) return;
    if (d.started) {
      d.ghost.remove(); d.src.el.style.opacity = '';
      const under = document.elementFromPoint(e.clientX, e.clientY);
      const tgt = under && (under.closest('.tgt') || (under.closest('.slot') && under.closest('.slot').querySelector('.bc.tgt')));
      if (tgt) B.tapTarget(tgt); else B.setMode(null);
      return;
    }
    if (Math.hypot(e.clientX - d.x, e.clientY - d.y) < 14) B.tap(d.t);
  };
  B.tap = t => {
    if (!B.alive) return;
    if (t.closest('.menu-btn') || t.closest('#btn-end')) return;
    const m = B.mode;
    if (m && m.kind === 'setup') { if (!B.busy) B.setupTap(t); return; }
    const bc = t.closest('.bc'), slot = t.closest('.slot');
    if (m && m.kind === 'promote') { if (bc && bc.classList.contains('tgt')) B.tapTarget(bc); return; }
    if (B.busy) { if (bc) B.inspect(bc); return; }
    if (m && (bc && bc.classList.contains('tgt') || slot && slot.classList.contains('tgt'))) { B.tapTarget(bc || slot); return; }
    if (bc && bc.parentNode === B.handEl) {
      if (m && m.kind === 'hand' && m.uid === +bc.dataset.uid) { B.inspect(bc); return; }
      B.selectHand(bc); return;
    }
    if (t.closest('.ezone.me .orb.cur')) { B.selectEnergy(); return; }
    if (m) { L.Sound.play('back'); B.setMode(null); return; }
    if (bc && bc.closest('.slot') === B.slots[ME].act && B.g.isMain(ME)) { B.sheet(); return; }
    if (bc) B.inspect(bc);
  };
  B.inspect = bc => { if (bc.classList.contains('hid')) return; L.Sound.play('tap'); L.Viewer.open([bc.dataset.id], 0); };
  B.selectHand = (bc, silent) => {
    const g = B.g, uid = +bc.dataset.uid, id = bc.dataset.id, c = L.CARDS[id];
    B.setMode({ kind: 'hand', uid, id }, true);
    bc.classList.add('sel');
    if (!silent) L.Sound.play('tap');
    const acts = [];
    let msg = '';
    if (c.kind === 'mon' && c.stage === 0) msg = g.canPlayBasic(ME, uid) ? 'ベンチの空きをタップして出す' : 'ベンチがいっぱいです';
    else if (c.kind === 'mon') msg = g.evoTargets(ME, uid).length ? `進化させる「${c.from}」をタップ` : (g.P[ME].turns <= 1 ? '最初の番は進化できません' : `場に出してから1ターンたった「${c.from}」が必要です`);
    else if (c.art === 'whirl') msg = g.canUseTrainer(ME, uid) ? '入れかえる相手のベンチをタップ' : (g.P[ME].f.supporter ? 'サポートはこの番もう使いました' : '相手のベンチにモンスターがいません');
    else if (g.canUseTrainer(ME, uid)) { msg = '長押しかもう一度タップで拡大'; acts.push(h('button', { class: 'btn sm', id: 'btn-use', onclick: () => B.do({ t: 'trainer', uid }) }, '使う')); }
    else msg = c.sub === 'supporter' && g.P[ME].f.supporter ? 'サポートはこの番もう使いました' : c.art === 'leaf' ? 'バトル場のモンスターがダメージを受けていません' : '今は使えません';
    if (c.kind === 'trainer') B.msg(msg, acts, c);
    else B.msg(msg + '(長押しで拡大)', acts);
    B.endBtn.disabled = false;
  };
  B.selectEnergy = silent => {
    const g = B.g, P = g.P[ME];
    if (!P.energy.cur || P.f.energyUsed) { L.Sound.play('error'); B.msg(P.f.energyUsed ? 'エネルギーはこの番もうつけました' : '最初の番はエネルギーが出ません'); return; }
    B.setMode({ kind: 'energy' }, true);
    B.orbs[ME].cur.classList.add('sel');
    if (!silent) L.Sound.play('tap');
    B.msg(`${L.TYPES[P.energy.cur].name}エネルギーをつけるモンスターをタップ`);
  };
  B.tapTarget = el => {
    const g = B.g, m = B.mode; if (!m) return;
    const bc = el.closest('.bc'), uid = bc ? +bc.dataset.uid : null;
    if (m.kind === 'hand') {
      const c = L.CARDS[m.id];
      if (c.kind === 'mon' && c.stage === 0) return B.do({ t: 'basic', uid: m.uid });
      if (c.kind === 'mon') return B.do({ t: 'evolve', uid: m.uid, target: uid });
      if (c.art === 'whirl') return B.do({ t: 'trainer', uid: m.uid, target: uid });
    }
    if (m.kind === 'energy') return B.do({ t: 'attach', uid });
    if (m.kind === 'retreat') return B.do({ t: 'retreat', uid });
    if (m.kind === 'promote') { const res = m.res; B.mode = null; B.busy = true; B.highlight(); const evs = g.promote(ME, uid); if (!evs.length) { L.Sound.play('error'); B.mode = m; B.busy = false; B.highlight(); return; } B.sendNet({ t: 'promote', uid }); B.serial(() => B.play(evs)).then(res); }
  };
  B.endTurn = async () => {
    if (B.busy || !B.g.isMain(ME)) return;
    const g = B.g, P = g.P[ME];
    const canAtk = P.active && P.active.def.attacks.some((a, i) => g.canAttack(ME, i));
    if (canAtk) {
      const ok = await L.confirmBox('ワザを使わずに終わりますか?', 'バトル場のモンスターはワザを使えます。このままターンを終えますか?', 'ターン終了', 'もどる');
      if (!ok) return;
    } else L.Sound.play('select');
    B.do({ t: 'end' });
  };

  /* ---------- 行動シート(ワザ・にげる) ---------- */
  B.sheet = () => {
    const g = B.g, P = g.P[ME], a = P.active; if (!a) return;
    L.Sound.play('select');
    const close = () => { bg.remove(); sh.remove(); };
    let bgDown = false;
    const bg = h('div', { class: 'sheet-bg', onpointerdown: () => { bgDown = true; }, onclick: () => { if (!bgDown) return; L.Sound.play('back'); close(); } });
    const sh = h('div', { class: 'sheet', role: 'dialog', 'aria-label': 'ワザを選ぶ' });

      h('p', null, reason, h('br'), `通算 ${D.stats.wins}勝 ${D.stats.losses}敗`),
      reward ? h('div', { class: 'reward' }, L.Eco.chip(), h('span', { class: 'rw-add' }, L.Eco.icon(), `+${reward}`)) : null,
      h('div', { class: 'acts' },
        B.online ? h('button', { class: 'btn', id: 'btn-lobby', onclick: () => { L.Sound.play('select'); L.Screens.go('online'); } }, 'ロビーへ') : h('button', { class: 'btn', id: 'btn-rematch', onclick: () => { L.Sound.play('select'); L.Music.play('battle'); B.start(B.root, B.params); } }, 'もう一度'),
        B.online ? null : h('button', { class: 'btn ghost', onclick: () => { L.Sound.play('back'); L.Screens.go('bselect'); } }, '相手を変える'),
        h('button', { class: 'btn ghost', onclick: () => { L.Sound.play('back'); L.Screens.go('home'); } }, 'ホームへ')));
    B.root.append(ov);
    const c = cen(ov.querySelector('h2'));
    if (win) { L.FX.rays(c.x, c.y, { colors: ['rgba(255,230,150,.7)', 'rgba(255,255,255,.6)'], life: 3, a: .5, spin: .3 }); L.FX.confetti(); L.FX.sparkle(c.x, c.y, { n: 30, speed: 420 }); }
    if (reward) setTimeout(() => { const ra = ov.querySelector('.rw-add'); if (ra && ra.isConnected) L.Eco.add(reward, { from: L.center(ra) }); else L.Eco.add(reward); }, 1100);
    L.anim(ov.querySelector('h2'), [{ transform: 'scale(2.4)', opacity: 0 }, { transform: 'scale(.92)', opacity: 1, offset: .6 }, { transform: 'scale(1)' }], { duration: 700, easing: 'cubic-bezier(.3,1.2,.5,1)' });
    setTimeout(() => { if (L.Screens.curName === 'battle' && B.root.querySelector('.result')) L.Music.play('home'); }, 3200);
  };
})();

/* ルミナリア — オンライン対戦のロビー(部屋を作る/コードで入る) */
(() => {
  const h = L.h;
  const inClaude = () => /claude\.ai|claudeusercontent|anthropic/.test(location.hostname);

  L.Screens.register('online', {
    bgm: 'home',
    enter() {
      L.BG.setTint(['#2fb8ff', '#3a4bd0', '#ff6fb1']);
      this.cleanup();
      this.render();
    },
    exit() {
      // 対戦画面へ進むときは部屋を引きつぐ。それ以外で離れるときは閉じる
      if (this.room && !this.handoff) this.leave();
      this.handoff = false;
    },
    cleanup() { if (this.room && !this.handoff) this.leave(); this.room = null; },
    async leave() {
      const r = this.room; this.room = null;
      if (!r) return;
      r.close();
      if (r.role === 'host' && !(r.data && r.data.guest)) L.Net.req('DELETE', `rooms/${r.code}`).catch(() => { });
    },
    profile() {
      const D = L.Save.data;
      let dk = L.getDeck(D.deckSel);
      if (!dk || L.validateDeck(dk.cards).length) dk = L.getDeck('rental:fire');
      return { name: (D.name || 'プレイヤー').slice(0, 10), deckName: dk.name, cards: dk.cards.slice(), energy: dk.energy.slice() };
    },
    render(state = 'menu', info = {}) {
      const el = this.el; el.innerHTML = '';
      const D = L.Save.data;
      const top = h('div', { class: 'topbar' }, L.ui.back('bselect'), h('h2', null, 'オンライン対戦'), L.Eco.chip(), L.ui.gear());
      const body = h('div', { class: 'scroll online', style: { flex: 1 } });
      el.append(top, body);

      if (!L.Net.available() || inClaude()) {
        body.append(h('div', { class: 'on-card' },
          h('h3', null, inClaude() ? 'この画面からは接続できません' : 'オンライン対戦は準備中です'),
          h('p', null, inClaude()
            ? 'claude.ai の中で開いたページは、外部のサーバーと通信できない決まりになっています。オンライン対戦は、公開版のURL(GitHub Pages など)から遊んでください。'
            : '対戦用のサーバー(Firebase)の設定がまだ入っていません。設定が入った版を公開すると遊べるようになります。')));
        return;
      }

      if (state === 'wait') {
        const r = this.room;
        const code = h('div', { class: 'code-big', 'aria-label': '部屋コード ' + r.code.split('').join(' ') }, r.code.split('').map(ch => h('span', null, ch)));
        const shareText = `ルミナリアで対戦しよう! 部屋コード: ${r.code}\n${location.href.split('#')[0]}`;
        body.append(h('div', { class: 'on-card wait' },
          h('p', { class: 'on-lead' }, 'この部屋コードを相手に送ってください'),
          code,
          h('div', { class: 'on-row' },
            h('button', { class: 'btn ghost sm', id: 'btn-copy', onclick: e => {
              L.Sound.play('tap');
              const btn = e.currentTarget;
              const done = () => { btn.textContent = 'コピーしました'; setTimeout(() => { btn.textContent = 'コードをコピー'; }, 1600); };
              try { navigator.clipboard.writeText(r.code).then(done, () => L.toast('コピーできませんでした。コードを書き写してください')); } catch (er) { L.toast('コピーできませんでした。コードを書き写してください'); }
            } }, 'コードをコピー'),
            navigator.share ? h('button', { class: 'btn ghost sm', onclick: () => { L.Sound.play('tap'); navigator.share({ text: shareText }).catch(() => { }); } }, 'LINEなどで送る') : null),
          h('div', { class: 'on-wait' }, h('i', { class: 'dots' }, h('b'), h('b'), h('b')), '相手が入るのを待っています'),
          h('p', { class: 'hint' }, `あなたのデッキ: ${this.profile().deckName}`),
          h('button', { class: 'btn ghost', id: 'btn-cancel-room', onclick: () => { L.Sound.play('back'); this.leave(); this.render(); } }, 'やめる')));
        return;
      }

      const name = h('input', { id: 'online-name', value: D.name || 'プレイヤー', maxlength: 10, 'aria-label': 'あなたの名前', oninput: e => { D.name = e.target.value.trim().slice(0, 10); L.Save.save(); } });
      const p = this.profile();
      const codeIn = h('input', { id: 'join-code', inputmode: 'text', autocapitalize: 'characters', autocomplete: 'off', maxlength: 5, placeholder: 'ABCDE', 'aria-label': '部屋コード',
        oninput: e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5); } });
      const msg = h('div', { class: 'on-msg', role: 'status' }, info.msg || '');
      body.append(
        h('div', { class: 'on-card' },
          h('label', { class: 'on-field', for: 'online-name' }, h('span', null, 'あなたの名前(相手に表示されます)'), name),
          h('div', { class: 'bs-deck' },
            h('div', null, h('small', null, '使うデッキ'), h('b', null, p.deckName)),
            h('button', { class: 'btn ghost sm', onclick: () => { L.Sound.play('tap'); L.Screens.go('deck'); } }, '変更'))),
        h('div', { class: 'on-card' },
          h('h3', null, '部屋を作る'),
          h('p', null, '5文字の部屋コードが出ます。それを相手に送ると対戦が始まります。'),
          h('button', { class: 'btn big shimmer', id: 'btn-create', onclick: () => this.create(msg) }, '部屋を作る')),
        h('div', { class: 'on-card' },
          h('h3', null, '部屋に入る'),
          h('p', null, '相手から届いた部屋コードを入れてください。'),
          h('div', { class: 'on-join' }, codeIn, h('button', { class: 'btn cyan', id: 'btn-join', onclick: () => this.join(codeIn.value, msg) }, '入る'))),
        msg,
        h('p', { class: 'hint on-note' }, `勝つとダイヤ+${L.ECON.online.win}、負けても+${L.ECON.online.lose}(6ターン以上続いた対戦のみ)。対戦中にページを閉じると、その対戦は続けられません。`));
    },
    busy(on) { this.el.querySelectorAll('#btn-create, #btn-join').forEach(b => { b.disabled = on; }); },
    async create(msg) {
      L.Sound.init(); L.Sound.play('select');
      this.busy(true); msg.textContent = '部屋を作っています…';
      try {
        const room = this.room = await L.Net.create(this.profile());
        room.on('update', d => { if (d && d.guest && this.room === room) this.startBattle(); });
        this.render('wait');
        if (room.data && room.data.guest) this.startBattle();
      } catch (e) {
        console.warn(e);
        this.busy(false);
        msg.textContent = '部屋を作れませんでした。通信状態を確認して、もう一度試してください。';
        L.Sound.play('error');
      }
    },
    async join(code, msg) {
      L.Sound.init();
      code = (code || '').toUpperCase().trim();
      if (!L.Net.CODE_RE.test(code)) { L.Sound.play('error'); msg.textContent = '部屋コードは5文字です(0・1・O・I は使いません)'; return; }
      L.Sound.play('select');
      this.busy(true); msg.textContent = '部屋をさがしています…';
      try {
        this.room = await L.Net.join(code, this.profile());
        this.startBattle();
      } catch (e) {
        this.busy(false);
        L.Sound.play('error');
        msg.textContent = { none: 'その部屋は見つかりませんでした。コードを確認してください。', full: 'その部屋はすでに対戦中です。', old: 'その部屋は古くなっています。新しく作ってもらってください。' }[e.reason] || '接続できませんでした。通信状態を確認して、もう一度試してください。';
      }
    },
    startBattle() {
      if (this.starting) return;
      this.starting = true;
      const room = this.room;
      room.handlers.update = [];
      L.Sound.play('revealRR');
      const c = L.center(this.el);
      L.FX.rays(c.x, c.y, { colors: ['rgba(126,243,255,.6)', 'rgba(255,255,255,.5)'], life: 1.2, a: .45 });
      setTimeout(() => {
        this.starting = false;
        this.handoff = true;
        this.room = null;
        L.Screens.go('battle', { online: { room } });
      }, 700);
    },
  });
})();

</script>
